<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>My Flashcards</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: sans-serif; background: #fdf7f0; color: #2d2320; padding: 20px 16px 60px; }
h1 { font-size: 1.8rem; color: #d4607f; text-align: center; margin-bottom: 4px; }
.sub { text-align: center; color: #9a8a85; font-size: .88rem; margin-bottom: 18px; }
.tabs { display: flex; gap: 6px; background: #fff; border-radius: 50px; padding: 5px; margin-bottom: 18px; box-shadow: 0 2px 12px rgba(0,0,0,.08); }
.tab { flex: 1; padding: 10px; border: none; background: transparent; border-radius: 50px; font-size: .85rem; cursor: pointer; color: #9a8a85; }
.tab.on { background: #f5b8cc; color: #2d2320; font-weight: bold; }
.stats { display: flex; gap: 10px; margin-bottom: 16px; }
.sp { flex: 1; background: #fff; border-radius: 12px; padding: 11px 6px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,.06); }
.sp .n { font-size: 1.4rem; font-weight: bold; }
.sp.pk .n { color: #d4607f; } .sp.gn .n { color: #4a9962; } .sp.gr .n { color: #9a8a85; }
.sp .l { font-size: .7rem; color: #9a8a85; margin-top: 2px; }
.btn-main { display: block; width: 100%; padding: 13px; background: #f5b8cc; border: none; border-radius: 12px; font-size: .95rem; font-weight: bold; cursor: pointer; margin-bottom: 14px; text-align: center; }
.folder-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 14px; }
.folder-card { background: #fff; border-radius: 14px; padding: 18px 12px; text-align: center; cursor: pointer; border: 2px solid #fce8ef; box-shadow: 0 2px 8px rgba(0,0,0,.06); }
.folder-card:active { background: #fce8ef; }
.fi { font-size: 1.8rem; margin-bottom: 6px; }
.fn { font-size: .95rem; font-weight: bold; }
.fc2 { font-size: .73rem; color: #9a8a85; margin-top: 2px; }
.fp { margin-top: 8px; height: 5px; background: #fce8ef; border-radius: 50px; }
.fpf { height: 100%; background: #f5b8cc; border-radius: 50px; }
.add-folder-card { background: #fce8ef; border: 2px dashed #f5b8cc; border-radius: 14px; padding: 18px 12px; text-align: center; cursor: pointer; }
.add-folder-card:active { background: #f5b8cc; }
.add-folder-card .fi { color: #d4607f; font-size: 1.5rem; }
.add-folder-card .fn { color: #d4607f; font-size: .9rem; }

/* cards view */
.bc { display: flex; gap: 8px; align-items: center; margin-bottom: 14px; font-size: .85rem; color: #9a8a85; }
.bc-home { background: none; border: none; cursor: pointer; color: #d4607f; font-size: .85rem; font-weight: bold; padding: 0; }
.deck-row { display: flex; gap: 7px; flex-wrap: wrap; margin-bottom: 14px; }
.chip { padding: 5px 13px; border-radius: 50px; border: 2px solid #fce8ef; background: #fff; font-size: .82rem; cursor: pointer; color: #9a8a85; }
.chip.on { border-color: #d4607f; color: #d4607f; background: #fce8ef; font-weight: bold; }
.pbar { margin-bottom: 14px; }
.plabel { display: flex; justify-content: space-between; font-size: .75rem; color: #9a8a85; margin-bottom: 4px; }
.ptrack { background: #fff; border-radius: 50px; height: 7px; overflow: hidden; }
.pfill { height: 100%; border-radius: 50px; background: #f5b8cc; }
.card-box { background: #fff; border-radius: 14px; padding: 28px 20px; text-align: center; min-height: 180px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; margin-bottom: 14px; box-shadow: 0 2px 12px rgba(0,0,0,.08); }
.card-box.back { background: #ddf0e4; }
.cq { font-size: 1.15rem; line-height: 1.5; margin-bottom: 8px; }
.chint { font-size: .8rem; color: #9a8a85; }
.ca { font-size: .97rem; line-height: 1.65; }
.ctx { font-size: .78rem; color: #9a8a85; font-style: italic; margin-top: 8px; display: block; }
.abts { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; margin-bottom: 12px; }
.ab { padding: 10px; border: none; border-radius: 12px; font-size: .85rem; font-weight: bold; cursor: pointer; }
.ab.hard { background: #fce8ef; color: #d4607f; }
.ab.medium { background: #fde8a0; color: #b38600; }
.ab.easy { background: #ddf0e4; color: #4a9962; }
.nav { display: flex; gap: 8px; justify-content: center; }
.nb { padding: 8px 18px; border-radius: 50px; border: 2px solid #f5b8cc; background: #fff; cursor: pointer; font-size: .83rem; }
.nb.pri { background: #f5b8cc; border-color: #f5b8cc; font-weight: bold; }

/* add / manage */
.panel { background: #fff; border-radius: 14px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,.06); }
.panel h2 { font-size: 1.15rem; color: #d4607f; margin-bottom: 14px; }
.fr { margin-bottom: 12px; }
.fr label { display: block; font-size: .72rem; font-weight: bold; color: #9a8a85; margin-bottom: 4px; text-transform: uppercase; }
.fr input, .fr textarea, .fr select { width: 100%; padding: 10px 12px; border: 2px solid #fce8ef; border-radius: 10px; font-size: .9rem; color: #2d2320; background: #fdf7f0; resize: vertical; font-family: sans-serif; }
.fr textarea { min-height: 72px; }
.fbtns { display: flex; gap: 8px; margin-top: 14px; }
.bpri { flex: 1; padding: 11px; background: #f5b8cc; border: none; border-radius: 10px; font-size: .9rem; font-weight: bold; cursor: pointer; }
.bsec { padding: 11px 16px; background: #fff; border: 2px solid #fce8ef; border-radius: 10px; font-size: .9rem; cursor: pointer; color: #9a8a85; }
.mlist { display: flex; flex-direction: column; gap: 8px; }
.mi { background: #fff; border-radius: 12px; padding: 11px 13px; display: flex; align-items: center; gap: 10px; box-shadow: 0 1px 6px rgba(0,0,0,.06); }
.mq { flex: 1; font-size: .85rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mb { font-size: .68rem; background: #fce8ef; color: #d4607f; padding: 2px 7px; border-radius: 50px; white-space: nowrap; }
.ms { font-size: .68rem; background: #ddf0e4; color: #4a9962; padding: 2px 7px; border-radius: 50px; white-space: nowrap; }
.del { background: none; border: none; cursor: pointer; color: #9a8a85; font-size: .95rem; flex-shrink: 0; }
.empty { text-align: center; padding: 40px 16px; color: #9a8a85; font-size: .95rem; }
.done { text-align: center; background: #fff; border-radius: 14px; padding: 36px 20px; box-shadow: 0 2px 8px rgba(0,0,0,.06); }
.done h2 { font-size: 1.4rem; color: #4a9962; margin-bottom: 8px; }
.done p { color: #9a8a85; margin-bottom: 18px; }

/* modal */
.overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 100; align-items: flex-start; justify-content: center; padding-top: 80px; }
.overlay.open { display: flex; }
.modal { background: #fff; border-radius: 16px; padding: 22px; width: 90%; max-width: 360px; }
.modal h3 { font-size: 1.1rem; color: #d4607f; margin-bottom: 12px; }
.toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%) translateY(100px); background: #2d2320; color: #fff; padding: 8px 20px; border-radius: 50px; font-size: .84rem; transition: transform .3s; z-index: 200; pointer-events: none; }
.toast.show { transform: translateX(-50%) translateY(0); }
</style>

</head>
<body>

<h1>My Flashcards</h1>
<p class="sub">Tous tes cours en un seul endroit</p>

<div class="tabs">
  <button class="tab on" id="t-study">Reviser</button>
  <button class="tab" id="t-add">+ Ajouter</button>
  <button class="tab" id="t-manage">Gerer</button>
</div>

<!-- STUDY PANEL — home rendered as static HTML, replaced by JS -->

<div id="panel-study">
  <div class="stats">
    <div class="sp pk"><div class="n" id="stat-total">-</div><div class="l">Total</div></div>
    <div class="sp gn"><div class="n" id="stat-easy">-</div><div class="l">Maitrisees</div></div>
    <div class="sp gr"><div class="n" id="stat-due">-</div><div class="l">A revoir</div></div>
  </div>
  <button class="btn-main" id="btn-study-all">Tout reviser</button>
  <div class="folder-grid" id="folder-grid">
    <!-- folders injected by JS -->
  </div>
</div>

<!-- ADD PANEL -->

<div id="panel-add" style="display:none">
  <div class="panel">
    <h2>Nouvelle carte</h2>
    <div class="fr"><label>Dossier</label><select id="ns"></select></div>
    <div class="fr"><label>Theme</label><input id="nd" type="text" placeholder="Ex: Brexit"/></div>
    <div class="fr"><label>Question</label><textarea id="nq" placeholder="Ex: What year was..."></textarea></div>
    <div class="fr"><label>Reponse</label><textarea id="na" placeholder="Ex: 1964..."></textarea></div>
    <div class="fr"><label>Note (optionnel)</label><input id="nc" type="text"/></div>
    <div class="fbtns">
      <button class="bpri" id="btn-save-card">Ajouter</button>
      <button class="bsec" id="btn-cancel-card">Annuler</button>
    </div>
  </div>
</div>

<!-- MANAGE PANEL -->

<div id="panel-manage" style="display:none">
  <div id="manage-list"></div>
</div>

<!-- CARDS VIEW (hidden until needed) -->

<div id="panel-cards" style="display:none">
  <div class="bc">
    <button class="bc-home" id="btn-back-home">Accueil</button>
    <span id="bc-sub"></span>
  </div>
  <div class="stats">
    <div class="sp pk"><div class="n" id="cstat-total">0</div><div class="l">Cartes</div></div>
    <div class="sp gn"><div class="n" id="cstat-easy">0</div><div class="l">Maitrisees</div></div>
    <div class="sp gr"><div class="n" id="cstat-due">0</div><div class="l">A revoir</div></div>
  </div>
  <div class="deck-row" id="deck-row"></div>
  <div class="pbar">
    <div class="plabel"><span id="prog-txt">0 / 0</span><span id="prog-pct">0%</span></div>
    <div class="ptrack"><div class="pfill" id="prog-fill" style="width:0%"></div></div>
  </div>
  <div id="card-content"></div>
</div>

<!-- MODAL -->

<div class="overlay" id="modal">
  <div class="modal">
    <h3>Nouveau dossier</h3>
    <div class="fr"><label>Nom</label><input id="folder-name" type="text" placeholder="Ex: Grammaire"/></div>
    <div class="fr"><label>Emoji</label><input id="folder-icon" type="text" placeholder="Ex: colle un emoji ici" maxlength="8"/></div>
    <div class="fbtns">
      <button class="bpri" id="btn-confirm-folder">Creer</button>
      <button class="bsec" id="btn-cancel-folder">Annuler</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── storage ──
var store = (function() {
  try {
    localStorage.setItem('_chk','1');
    localStorage.removeItem('_chk');
    return localStorage;
  } catch(e) {
    var m = {};
    return {
      getItem: function(k) { return m.hasOwnProperty(k) ? m[k] : null; },
      setItem: function(k,v) { m[k] = String(v); }
    };
  }
}());

// ── defaults ──
var SUBJECTS = [
  {id:'s1', name:'Civilisation', icon:'🌍'},
  {id:'s2', name:'Litterature', icon:'📚'}
];
var CARDS = [
  {id:1, sub:'s1', deck:'Brexit', q:'What date was the Brexit referendum?', a:'June 23, 2016. Result: 52% Leave vs 48% Remain.', ctx:'Core date - always know this.', diff:'new'},
  {id:2, sub:'s1', deck:'Brexit', q:'When did the UK officially leave the EU?', a:'January 31, 2020. Transition period until Dec 31, 2020.', ctx:'4 years between vote and exit.', diff:'new'},
  {id:3, sub:'s1', deck:'Brexit', q:'Who triggered Article 50 and when?', a:'Theresa May, March 2017 - starting the 2-year exit process.', ctx:'Article 50 = official notice to leave.', diff:'new'},
  {id:4, sub:'s1', deck:'Brexit', q:'How many times did Parliament reject the Withdrawal Agreement?', a:'Three times. Led to May resigning, Johnson taking over in 2019.', ctx:'Shows the scale of the deadlock.', diff:'new'},
  {id:5, sub:'s1', deck:'Brexit', q:'What was the Leave campaign key slogan?', a:'Take Back Control. Focused on sovereignty, immigration, identity.', ctx:'UKIP under Farage pushed this hard.', diff:'new'},
  {id:6, sub:'s1', deck:'Brexit', q:'How did Scotland vote and what did the SNP demand?', a:'62% Remain. SNP demanded a second independence referendum.', ctx:'Key devolution tension post-Brexit.', diff:'new'},
  {id:7, sub:'s1', deck:'Brexit', q:'Why was Brexit a threat to the Good Friday Agreement?', a:'The 1998 Agreement made the Irish border invisible. Brexit risked reimposing a hard border, destabilising peace.', ctx:'Most complex geopolitical dimension.', diff:'new'},
  {id:8, sub:'s1', deck:'Brexit', q:'What replaced the Northern Ireland Protocol?', a:'The Windsor Framework (2023) - N. Ireland stays aligned with EU rules.', ctx:'Still controversial with Unionists.', diff:'new'},
  {id:9, sub:'s1', deck:'Brexit', q:'Name 4 fractures Brexit revealed.', a:'England+Wales (Leave) vs Scotland+N.Ireland (Remain). Urban vs Rural. Young vs Old. Graduates vs Non-graduates.', ctx:'Brexit as identity crisis.', diff:'new'},
  {id:10, sub:'s1', deck:'Brexit', q:'Name 5 key Brexit vocabulary words.', a:'sovereignty, trade deal, hard/soft Brexit, devolution, border issue', ctx:'Use these naturally in your oral.', diff:'new'},
  {id:11, sub:'s1', deck:'Race in America', q:'What did the 1964 Civil Rights Act do?', a:'Outlawed discrimination based on race, colour, religion, sex. Signed by LBJ after years of activism.', ctx:'MLK was key figure.', diff:'new'},
  {id:12, sub:'s1', deck:'Race in America', q:'What sparked the 2020 BLM protests?', a:'Murder of George Floyd by officer Derek Chauvin, May 25, 2020 in Minneapolis.', ctx:'Global reckoning on systemic racism.', diff:'new'},
  {id:13, sub:'s1', deck:'Race in America', q:'What is systemic racism?', a:'Racism in institutions, laws, systems - not just individual prejudice. Seen in policing, housing, healthcare, education.', ctx:'Distinguish from individual racism.', diff:'new'},
  {id:14, sub:'s1', deck:'Climate', q:'What is the Paris Agreement?', a:'UN accord signed in 2015, targeting max 1.5-2 degrees of warming above pre-industrial levels.', ctx:'US withdrew under Trump, rejoined under Biden.', diff:'new'},
  {id:15, sub:'s1', deck:'Climate', q:'Who started Fridays for Future?', a:'Greta Thunberg, 2018. Her How dare you UN speech in 2019 became iconic.', ctx:'Youth vs political inaction.', diff:'new'},
  {id:16, sub:'s1', deck:'Media', q:'What is fake news and why is it dangerous?', a:'Deliberately false info spread via media/social networks. Erodes trust in institutions.', ctx:'Trump weaponised the term.', diff:'new'},
  {id:17, sub:'s1', deck:'Media', q:'What is the BBC and how is it funded?', a:'UK public broadcaster, funded by licence fee (~169 GBP/year). Independent of government.', ctx:'Model of public service journalism.', diff:'new'},
  {id:18, sub:'s2', deck:'The Tempest', q:'Who wrote The Tempest and when?', a:'Shakespeare, around 1610-1611. Generally his last solo play.', ctx:'Often read as his farewell to theatre.', diff:'new'},
  {id:19, sub:'s2', deck:'The Tempest', q:'What does Caliban say about language?', a:'You taught me language, and my profit on it is I know how to curse. Language as control - Caliban turns it into resistance.', ctx:'Core postcolonial reading.', diff:'new'}
];

// ── state ──
var subjects, cards, activeSub, activeDeck, queue, qIdx, revealed, sessionDone;

function loadData() {
  var ss = store.getItem('fcs4');
  var sc = store.getItem('fcc4');
  subjects = ss ? tryParse(ss, cloneArr(SUBJECTS)) : cloneArr(SUBJECTS);
  cards    = sc ? tryParse(sc, cloneArr(CARDS))    : cloneArr(CARDS);
}
function tryParse(str, fallback) {
  try { var v = JSON.parse(str); return (v && typeof v === 'object' && v.length !== undefined) ? v : fallback; }
  catch(e) { return fallback; }
}
function cloneArr(arr) {
  var out = [];
  for (var i = 0; i < arr.length; i++) {
    var o = {}, s = arr[i];
    for (var k in s) { o[k] = s[k]; }
    out.push(o);
  }
  return out;
}
function persist() {
  try { store.setItem('fcs4', JSON.stringify(subjects)); } catch(e) {}
  try { store.setItem('fcc4', JSON.stringify(cards));    } catch(e) {}
}
function findSub(id) {
  for (var i = 0; i < subjects.length; i++) if (subjects[i].id === id) return subjects[i];
  return null;
}
function countEasy(arr) {
  var n = 0;
  for (var i = 0; i < arr.length; i++) if (arr[i].diff === 'easy') n++;
  return n;
}

// ── tabs ──
function showPanel(name) {
  var panels = ['study','add','manage','cards'];
  for (var i = 0; i < panels.length; i++) {
    var el = document.getElementById('panel-' + panels[i]);
    if (el) el.style.display = panels[i] === name ? 'block' : 'none';
  }
  var tabs = ['study','add','manage'];
  for (var j = 0; j < tabs.length; j++) {
    var t = document.getElementById('t-' + tabs[j]);
    if (t) t.className = 'tab' + (tabs[j] === name || (name === 'cards' && tabs[j] === 'study') ? ' on' : '');
  }
}

// ── HOME ──
function renderHome() {
  showPanel('study');

  // stats
  var easy = countEasy(cards);
  document.getElementById('stat-total').textContent = cards.length;
  document.getElementById('stat-easy').textContent  = easy;
  document.getElementById('stat-due').textContent   = cards.length - easy;

  // folders
  var grid = document.getElementById('folder-grid');
  var html = '';
  for (var i = 0; i < subjects.length; i++) {
    var s = subjects[i];
    var sc = 0, se = 0;
    for (var j = 0; j < cards.length; j++) {
      if (cards[j].sub === s.id) { sc++; if (cards[j].diff === 'easy') se++; }
    }
    var pct = sc ? Math.round(se / sc * 100) : 0;
    html += '<div class="folder-card" data-sid="' + s.id + '">'
      + '<div class="fi">' + s.icon + '</div>'
      + '<div class="fn">' + s.name + '</div>'
      + '<div class="fc2">' + sc + ' cartes</div>'
      + '<div class="fp"><div class="fpf" style="width:' + pct + '%"></div></div>'
      + '</div>';
  }
  html += '<div class="add-folder-card" id="btn-new-folder">'
    + '<div class="fi">+</div>'
    + '<div class="fn">Nouveau dossier</div>'
    + '</div>';
  grid.innerHTML = html;

  // folder click events
  var fcs = grid.getElementsByClassName('folder-card');
  for (var k = 0; k < fcs.length; k++) {
    fcs[k].onclick = (function(sid) {
      return function() { goToSubject(sid); };
    })(fcs[k].getAttribute('data-sid'));
  }
  document.getElementById('btn-new-folder').onclick = function() {
    document.getElementById('modal').className = 'overlay open';
  };
}

// ── SUBJECT/CARDS ──
function buildQueue() {
  var pool = [];
  for (var i = 0; i < cards.length; i++) {
    var c = cards[i];
    if (activeSub && c.sub !== activeSub) continue;
    if (activeDeck !== 'Tous' && c.deck !== activeDeck) continue;
    pool.push(c);
  }
  pool.sort(function(a,b){
    var o={hard:0,medium:1,new:2,easy:3};
    return (o[a.diff]!==undefined?o[a.diff]:2)-(o[b.diff]!==undefined?o[b.diff]:2);
  });
  queue=pool; qIdx=0; revealed=false; sessionDone=0;
}

function goToSubject(sid) {
  activeSub = sid; activeDeck = 'Tous'; buildQueue(); renderCards();
}
function goToAll() {
  activeSub = null; activeDeck = 'Tous'; buildQueue(); renderCards();
}

function renderCards() {
  showPanel('cards');

  var subj = activeSub ? findSub(activeSub) : null;
  document.getElementById('bc-sub').textContent = subj ? (' › ' + subj.icon + ' ' + subj.name) : ' › Tout';

  // stats
  var pool = [];
  for (var i = 0; i < cards.length; i++) if (!activeSub || cards[i].sub === activeSub) pool.push(cards[i]);
  var easy = countEasy(pool);
  document.getElementById('cstat-total').textContent = pool.length;
  document.getElementById('cstat-easy').textContent  = easy;
  document.getElementById('cstat-due').textContent   = pool.length - easy;

  // decks
  var decks = ['Tous'];
  for (var d = 0; d < pool.length; d++) {
    var found = false;
    for (var di = 0; di < decks.length; di++) { if (decks[di] === pool[d].deck) { found = true; break; } }
    if (!found) decks.push(pool[d].deck);
  }
  var dr = document.getElementById('deck-row');
  var dhtml = '';
  for (var dk = 0; dk < decks.length; dk++) {
    dhtml += '<button class="chip' + (decks[dk]===activeDeck?' on':'') + '" data-deck="' + decks[dk] + '">' + decks[dk] + '</button>';
  }
  dr.innerHTML = dhtml;
  var chips = dr.getElementsByTagName('button');
  for (var ci = 0; ci < chips.length; ci++) {
    chips[ci].onclick = (function(dn) {
      return function() { activeDeck = dn; buildQueue(); renderCards(); };
    })(chips[ci].getAttribute('data-deck'));
  }

  // progress
  var pct = queue.length ? Math.round(sessionDone/queue.length*100) : 0;
  document.getElementById('prog-txt').textContent  = sessionDone + ' / ' + queue.length;
  document.getElementById('prog-pct').textContent  = pct + '%';
  document.getElementById('prog-fill').style.width = pct + '%';

  // card content
  var cc = document.getElementById('card-content');
  if (!queue.length) {
    cc.innerHTML = '<div class="empty">Aucune carte ici. Ajoute-en depuis + !</div>';
  } else if (qIdx >= queue.length) {
    cc.innerHTML = '<div class="done"><h2>Session terminee !</h2><p>Tu as revu ' + sessionDone + ' cartes</p><button class="nb pri" id="btn-restart">Recommencer</button></div>';
    document.getElementById('btn-restart').onclick = function() { buildQueue(); renderCards(); };
  } else {
    var c = queue[qIdx];
    if (!revealed) {
      cc.innerHTML = '<div class="card-box" id="card-box"><p class="cq">' + c.q + '</p><p class="chint">Appuie pour voir la reponse</p></div>'
        + '<div class="nav"><button class="nb" id="btn-prev">Precedent</button><button class="nb" id="btn-skip">Passer</button></div>';
      document.getElementById('card-box').onclick = function() { revealed = true; renderCards(); };
    } else {
      cc.innerHTML = '<div class="card-box back">' + c.a + (c.ctx ? '<span class="ctx">💡 ' + c.ctx + '</span>' : '') + '</div>'
        + '<div class="abts">'
        + '<button class="ab hard" id="btn-hard">Difficile</button>'
        + '<button class="ab medium" id="btn-med">Moyen</button>'
        + '<button class="ab easy" id="btn-easy">Maitrise !</button>'
        + '</div>'
        + '<div class="nav"><button class="nb" id="btn-prev">Precedent</button><button class="nb" id="btn-skip">Passer</button></div>';
      document.getElementById('btn-hard').onclick   = function() { rate('hard'); };
      document.getElementById('btn-med').onclick    = function() { rate('medium'); };
      document.getElementById('btn-easy').onclick   = function() { rate('easy'); };
    }
    document.getElementById('btn-prev').onclick = function() { if(qIdx>0){qIdx--;revealed=false;renderCards();} };
    document.getElementById('btn-skip').onclick = function() { qIdx++;revealed=false;renderCards(); };
  }
}

function rate(diff) {
  for (var i = 0; i < cards.length; i++) {
    if (cards[i].id === queue[qIdx].id) { cards[i].diff = diff; break; }
  }
  persist(); sessionDone++; qIdx++; revealed=false; renderCards();
}

// ── ADD ──
function renderAdd() {
  showPanel('add');
  var sel = document.getElementById('ns');
  sel.innerHTML = '';
  for (var i = 0; i < subjects.length; i++) {
    var opt = document.createElement('option');
    opt.value = subjects[i].id;
    opt.textContent = subjects[i].icon + ' ' + subjects[i].name;
    sel.appendChild(opt);
  }
}

// ── MANAGE ──
function renderManage() {
  showPanel('manage');
  var el = document.getElementById('manage-list');
  if (!cards.length) { el.innerHTML = '<div class="empty">Aucune carte.</div>'; return; }
  var html = '<div class="mlist">';
  for (var i = 0; i < cards.length; i++) {
    var c = cards[i], s = findSub(c.sub);
    html += '<div class="mi">'
      + '<div class="mq">' + c.q + '</div>'
      + (s ? '<span class="ms">' + s.icon + '</span>' : '')
      + '<span class="mb">' + c.deck + '</span>'
      + '<button class="del" data-cid="' + c.id + '">x</button>'
      + '</div>';
  }
  html += '</div>';
  el.innerHTML = html;
  var dels = el.getElementsByClassName('del');
  for (var d = 0; d < dels.length; d++) {
    dels[d].onclick = (function(cid) {
      return function() {
        var nc = [];
        for (var i = 0; i < cards.length; i++) if (cards[i].id !== cid) nc.push(cards[i]);
        cards = nc; persist(); buildQueue(); renderManage(); toast('Supprimee !');
      };
    })(parseInt(dels[d].getAttribute('data-cid'), 10));
  }
}

// ── TOAST ──
function toast(msg) {
  var el = document.getElementById('toast');
  el.textContent = msg; el.className = 'toast show';
  setTimeout(function() { el.className = 'toast'; }, 2200);
}

// ── INIT ──
loadData();
activeSub = null; activeDeck = 'Tous';
queue = []; qIdx = 0; revealed = false; sessionDone = 0;

// tab buttons
document.getElementById('t-study').onclick = function() { renderHome(); };
document.getElementById('t-add').onclick   = function() { renderAdd(); };
document.getElementById('t-manage').onclick= function() { renderManage(); };

// study-all
document.getElementById('btn-study-all').onclick = function() { goToAll(); };

// back home
document.getElementById('btn-back-home').onclick = function() { renderHome(); };

// add card
document.getElementById('btn-save-card').onclick = function() {
  var sub  = document.getElementById('ns').value;
  var deck = document.getElementById('nd').value.trim();
  var q    = document.getElementById('nq').value.trim();
  var a    = document.getElementById('na').value.trim();
  var ctx  = document.getElementById('nc').value.trim();
  if (!q || !a || !deck) { toast('Remplis tous les champs !'); return; }
  cards.push({id:Date.now(), sub:sub, deck:deck, q:q, a:a, ctx:ctx, diff:'new'});
  persist();
  document.getElementById('nd').value = '';
  document.getElementById('nq').value = '';
  document.getElementById('na').value = '';
  document.getElementById('nc').value = '';
  toast('Carte ajoutee !'); renderHome();
};
document.getElementById('btn-cancel-card').onclick = function() { renderHome(); };

// modal
document.getElementById('btn-confirm-folder').onclick = function() {
  var name = document.getElementById('folder-name').value.trim();
  var icon = document.getElementById('folder-icon').value.trim() || '📁';
  if (!name) { toast('Donne un nom !'); return; }
  subjects.push({id:'s'+Date.now(), name:name, icon:icon});
  persist();
  document.getElementById('modal').className = 'overlay';
  document.getElementById('folder-name').value = '';
  document.getElementById('folder-icon').value = '';
  renderHome(); toast('Dossier cree !');
};
document.getElementById('btn-cancel-folder').onclick = function() {
  document.getElementById('modal').className = 'overlay';
};

// render home
renderHome();
</script>
