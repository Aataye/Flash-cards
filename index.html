{id:108,sub:'s1',deck:'Brexit dates',q:'Brexit timeline 1957 to 2009 — the pre-history.',a:'1957: EEC created by Treaty of Rome — Britain refuses to join. 1963 + 1967: De Gaulle vetoes British membership twice. 1973: Britain joins the EEC under Heath (who uses royal prerogative — no Parliament vote). 1992: Maastricht Treaty — EEC becomes the European Union (John Major signs but refuses euro and social protocol). 2007 Lisbon Treaty (in force 2009): crucially adds Article 50 (the exit mechanism). Without Lisbon, Brexit would have had no legal framework.',ctx:'Chain: Lisbon → Cameron promises referendum → 2016 → Brexit.',diff:'new'},
{id:109,sub:'s1',deck:'Brexit dates',q:'Brexit timeline 2013 to 2020 — referendum to exit.',a:'January 2013: Cameron promises an in/out referendum if Conservatives win 2015 election. May 2015: Conservatives win. June 23, 2016: 51.9% vote Leave — Cameron resigns next morning. March 2017: May triggers Article 50 (after Supreme Court ruled 8-3 she needed Parliament\'s approval). January 2019, March 2019, March 2019: May\'s deal rejected THREE times. December 2018: May survives confidence vote (200 for, 117 against). May 2019: May resigns in tears. January 31, 2020: UK officially leaves the EU. December 31, 2020: transition period ends.',ctx:'Cameron called the referendum and walked away. May tried and failed. Johnson got it done.',diff:'new'},

// ── DÉMOCRATIE US — Dates clés ─────────────────────────────
{id:110,sub:'s2',deck:'Histoire US dates',q:'Key US constitutional dates — 1776 to 1791.',a:'1776 July 4: Declaration of Independence (Thomas Jefferson) — "life, liberty and the pursuit of happiness". 1787: Constitution drafted in Philadelphia — three branches of government, separation of powers. 1788: Constitution ratified. 1789: George Washington becomes first President. 1791: Bill of Rights — first 10 amendments (freedom of speech, religion, press; right to bear arms; jury trial, etc.).',ctx:'The Bill of Rights was added to reassure anti-Federalists that individual rights would be protected.',diff:'new'},
{id:111,sub:'s2',deck:'Histoire US dates',q:'Civil War to Civil Rights — key dates 1861-1965.',a:'1861-65: Civil War. 1865 13th Amendment: abolished slavery EXCEPT as punishment for crime. 1868 14th Amendment: equal protection under law. 1877-1960s: Jim Crow laws (racial segregation in the South). 1896 Plessy v Ferguson: "separate but equal" constitutional — legalizes segregation. 1954 Brown v Board of Education: school segregation unconstitutional. 1963 March on Washington (250,000), MLK\'s "I Have a Dream". 1964 Civil Rights Act. 1965 Voting Rights Act.',ctx:'MLK assassinated April 4, 1968, in Memphis. George Floyd killed May 25, 2020.',diff:'new'},

{id:112,sub:'s2',deck:'Reve Americain dates',q:'American Dream key dates — from Puritans to today.',a:'1630: John Winthrop\'s "City upon a Hill" (Puritan vision of America as the world\'s perfect model). 1642/1647 Old Deluder Satan Acts (Massachusetts): first compulsory education laws in the world — every town of 50+ families must have a teacher. 1776: Declaration of Independence — "pursuit of happiness". 1886: Statue of Liberty installed (gift from France) — "Give me your tired, your poor..." 1929: Great Depression exposes the myth — hard work alone cannot protect against systemic failure.',ctx:'The Protestant work ethic: success = sign of God\'s blessing. Poverty = lack of effort.',diff:'new'},

{id:113,sub:'s1',deck:'Dates cles Irlande',q:'Bobby Sands 1981, Brighton 1984, Downing Street Declaration 1993 — what happened?',a:'1981: Bobby Sands is the first of 10 IRA prisoners to die on hunger strike at the Maze Prison in Belfast. They demanded prisoner-of-war status. 1984: IRA bomb at the Grand Hotel in Brighton narrowly misses Thatcher during the Conservative Party Conference. 1993 Downing Street Declaration: John Major + Irish Taoiseach Albert Reynolds — Sinn Fein may participate in talks if IRA ends violence. 1994: IRA ceasefire declared.',ctx:'The hunger strikers galvanized republican support internationally, especially in the US.',diff:'new'},
{id:114,sub:'s1',deck:'Dates cles Irlande',q:'Sunningdale 1973 vs Good Friday Agreement 1998 — what is the difference?',a:'Both created power-sharing assemblies in Northern Ireland. Sunningdale (December 1973): collapsed in May 1974 due to a Protestant workers\' general strike. Good Friday Agreement (April 10, 1998): survived because the IRA ceasefire held, the US was involved (Senator George Mitchell mediated), and both communities voted for it (71% Yes NI, 94% Yes Republic). IRA formally ended armed activities July 2005.',ctx:'"Sunningdale for slow learners" — the GFA was essentially what Sunningdale proposed 25 years earlier.',diff:'new'},

{id:115,sub:'s1',deck:'Systeme politique UK',q:'1715, 1917, 1969, 2022 — four political milestones.',a:'1715: convention established that the PM chooses all ministers from the same party (started by William III in 1689, became the rule in 1715). 1917: first official use of the title "Prime Minister" in a law concerning Chequers (the PM\'s country residence). 1969 Representation of the People Act: voting age lowered from 21 to 18. 2022 Dissolution and Calling of Parliament Act: Parliament automatically dissolves after 5 years (or earlier on PM\'s request or if government loses a confidence vote).',ctx:'Before 2022, the Fixed-term Parliaments Act 2011 had complicated dissolution. 2022 reverted to simpler rules.',diff:'new'},

// ── STATE ──────────────────────────────────────────────────
var store=(function(){try{localStorage.setItem('_x','1');localStorage.removeItem('_x');return localStorage;}catch(e){var m={};return{getItem:function(k){return m.hasOwnProperty(k)?m[k]:null;},setItem:function(k,v){m[k]=String(v);}};}})();
var subjects,cards,checkedSubs,studyFilter,activeDeck,mode,queue,qIdx,revealed,done;
var qcmIdx,qcmScore,matchQs,matchAs,selQ,selA,matchDone;

function loadData(){
  var ss=store.getItem('fcs9'),sc=store.getItem('fcc9');
  subjects=ss?tryParse(ss,cloneArr(SUBJECTS)):cloneArr(SUBJECTS);
  cards=sc?tryParse(sc,cloneArr(CARDS)):cloneArr(CARDS);
}
function tryParse(s,fb){try{var v=JSON.parse(s);return(v&&v.length!==undefined)?v:fb;}catch(e){return fb;}}
function cloneArr(a){var o=[];for(var i=0;i<a.length;i++){var n={},s=a[i];for(var k in s)n[k]=s[k];o.push(n);}return o;}
function persist(){try{store.setItem('fcs9',JSON.stringify(subjects));}catch(e){}try{store.setItem('fcc9',JSON.stringify(cards));}catch(e){}}
function findSub(id){for(var i=0;i<subjects.length;i++)if(subjects[i].id===id)return subjects[i];return null;}
function countEasy(arr){var n=0;for(var i=0;i<arr.length;i++)if(arr[i].diff==='easy')n++;return n;}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}

// ── PANELS ─────────────────────────────────────────────────
function showPanel(name){
  ['study','add','manage','cards'].forEach(function(p){
    var el=document.getElementById('panel-'+p);
    if(el)el.style.display=p===name?'block':'none';
  });
  ['study','add','manage'].forEach(function(t){
    var el=document.getElementById('t-'+t);
    if(el)el.className='tab'+(t===name||(name==='cards'&&t==='study')?' on':'');
  });
}

// ── HOME ───────────────────────────────────────────────────
function renderHome(){
  showPanel('study');
  var easy=countEasy(cards);
  document.getElementById('st-tot').textContent=cards.length;
  document.getElementById('st-ok').textContent=easy;
  document.getElementById('st-due').textContent=cards.length-easy;
  var sb=document.getElementById('btn-sel');
  if(checkedSubs.length>0){sb.className='btn-sel vis';sb.textContent='✓ Étudier la sélection ('+checkedSubs.length+')';}
  else{sb.className='btn-sel';}
  var fg=document.getElementById('fg'),html='';
  for(var i=0;i<subjects.length;i++){
    var s=subjects[i],sc=0,se=0;
    for(var j=0;j<cards.length;j++){if(cards[j].sub===s.id){sc++;if(cards[j].diff==='easy')se++;}}
    var pct=sc?Math.round(se/sc*100):0,ck=checkedSubs.indexOf(s.id)!==-1;
    html+='<div class="fc'+(ck?' ck':'')+'" data-sid="'+s.id+'">'
      +'<div class="fch'+(ck?' on':'')+'" data-csid="'+s.id+'">'+(ck?'✓':'')+'</div>'
      +'<div class="fi">'+s.icon+'</div><div class="fn">'+s.name+'</div>'
      +'<div class="fc2">'+sc+' cartes</div>'
      +'<div class="fp"><div class="fpf" style="width:'+pct+'%"></div></div></div>';
  }
  html+='<div class="add-fc" id="btn-nf"><div class="fi">+</div><div class="fn">Nouveau dossier</div></div>';
  fg.innerHTML=html;
  fg.querySelectorAll('.fc').forEach(function(el){
    el.onclick=function(){studyFilter=[this.getAttribute('data-sid')];checkedSubs=[];startSession();};
    el.querySelector('.fch').onclick=function(e){
      e.stopPropagation();
      var sid=this.getAttribute('data-csid'),idx=checkedSubs.indexOf(sid);
      if(idx===-1)checkedSubs.push(sid);else checkedSubs.splice(idx,1);
      renderHome();
    };
  });
  document.getElementById('btn-nf').onclick=function(){document.getElementById('modal-folder').className='overlay open';};
}

function startSession(){
  var pool=[];
  for(var i=0;i<cards.length;i++){
    var c=cards[i];
    if(studyFilter.length>0&&studyFilter.indexOf(c.sub)===-1)continue;
    pool.push(c);
  }
  if(!pool.length){toast('Aucune carte dans cette sélection !');return;}
  if(mode==='flash'){
    pool.sort(function(a,b){var o={hard:0,medium:1,new:2,easy:3};return(o[a.diff]!==undefined?o[a.diff]:2)-(o[b.diff]!==undefined?o[b.diff]:2);});
    queue=pool;qIdx=0;revealed=false;done=0;
  }else if(mode==='qcm'){
    queue=shuffle(pool.slice());qcmIdx=0;qcmScore=0;
  }else if(mode==='match'){
    queue=shuffle(pool.slice());qIdx=0;matchDone=0;
  }
  activeDeck='Tous';
  showPanel('cards');
  renderCards();
}

// ── CARDS VIEW ─────────────────────────────────────────────
function renderCards(){
  var pool=[];
  for(var i=0;i<cards.length;i++){
    if(studyFilter.length===0||studyFilter.indexOf(cards[i].sub)!==-1){
      if(activeDeck==='Tous'||cards[i].deck===activeDeck)pool.push(cards[i]);
    }
  }
  var easy=countEasy(pool);
  document.getElementById('cs-tot').textContent=pool.length;
  document.getElementById('cs-ok').textContent=easy;
  document.getElementById('cs-due').textContent=pool.length-easy;

  // breadcrumb
  var bt='';
  if(studyFilter.length===0)bt=' › Tout';
  else if(studyFilter.length===1){var s=findSub(studyFilter[0]);bt=s?' › '+s.icon+' '+s.name:'';}
  else bt=' › '+studyFilter.length+' dossiers';
  document.getElementById('bc-sub').textContent=bt;

  // deck chips
  var allPool=[];
  for(var i=0;i<cards.length;i++){if(studyFilter.length===0||studyFilter.indexOf(cards[i].sub)!==-1)allPool.push(cards[i]);}
  var decks=['Tous'];
  allPool.forEach(function(c){if(decks.indexOf(c.deck)===-1)decks.push(c.deck);});
  var dr=document.getElementById('deck-row');
  dr.innerHTML=decks.map(function(d,i){return'<button class="chip'+(d===activeDeck?' on':'')+'" data-di="'+i+'">'+d+'</button>';}).join('');
  dr.querySelectorAll('.chip').forEach(function(el,i){
    el.onclick=function(){activeDeck=decks[i];buildQueue();renderCards();};
  });

  if(mode==='flash')renderFlash();
  else if(mode==='qcm')renderQCM();
  else if(mode==='match')renderMatch();
}

function buildQueue(){
  var pool=[];
  for(var i=0;i<cards.length;i++){
    var c=cards[i];
    if(studyFilter.length>0&&studyFilter.indexOf(c.sub)===-1)continue;
    if(activeDeck!=='Tous'&&c.deck!==activeDeck)continue;
    pool.push(c);
  }
  if(mode==='flash'){
    pool.sort(function(a,b){var o={hard:0,medium:1,new:2,easy:3};return(o[a.diff]!==undefined?o[a.diff]:2)-(o[b.diff]!==undefined?o[b.diff]:2);});
    queue=pool;qIdx=0;revealed=false;done=0;
  }else if(mode==='qcm'){
    queue=shuffle(pool.slice());qcmIdx=0;qcmScore=0;
  }else{
    queue=shuffle(pool.slice());qIdx=0;
  }
}

// ── FLASH MODE ─────────────────────────────────────────────
function renderFlash(){
  var cc=document.getElementById('card-content');
  var pct=queue.length?Math.round(done/queue.length*100):0;
  document.getElementById('pg-txt').textContent=done+' / '+queue.length;
  document.getElementById('pg-pct').textContent=pct+'%';
  document.getElementById('pg-fl').style.width=pct+'%';

  if(!queue.length){cc.innerHTML='<div class="done"><h2>Aucune carte ici</h2><p>Ajoute des cartes depuis + !</p></div>';return;}
  if(qIdx>=queue.length){
    cc.innerHTML='<div class="done"><h2>🎉 Session terminée !</h2><p>'+done+' cartes révisées</p><button class="nb pri" id="btn-restart">Recommencer</button></div>';
    document.getElementById('btn-restart').onclick=function(){buildQueue();renderFlash();};
    return;
  }
  var c=queue[qIdx];
  if(!revealed){
    cc.innerHTML='<div class="card-box" id="cbox"><p class="cq">'+c.q+'</p><p class="chint">Appuie pour voir la réponse ✦</p></div>'
      +'<div class="nav"><button class="nb" id="bprev">← Précédent</button><button class="nb" id="bskip">Passer →</button></div>';
    document.getElementById('cbox').onclick=function(){revealed=true;renderFlash();};
  }else{
    cc.innerHTML='<div class="card-box back">'+c.a+(c.ctx?'<span class="ctx">💡 '+c.ctx+'</span>':'')+'</div>'
      +'<div class="abts"><button class="ab hard" id="bh">😬 Difficile</button><button class="ab medium" id="bm">🤔 Moyen</button><button class="ab easy" id="be">✅ Maîtrisé !</button></div>'
      +'<div class="nav"><button class="nb" id="bprev">← Précédent</button><button class="nb" id="bskip">Passer →</button></div>';
    document.getElementById('bh').onclick=function(){rate('hard');};
    document.getElementById('bm').onclick=function(){rate('medium');};
    document.getElementById('be').onclick=function(){rate('easy');};
  }
  document.getElementById('bprev').onclick=function(){if(qIdx>0){qIdx--;revealed=false;renderFlash();}};
  document.getElementById('bskip').onclick=function(){qIdx++;revealed=false;renderFlash();};
}
function rate(diff){
  for(var i=0;i<cards.length;i++)if(cards[i].id===queue[qIdx].id){cards[i].diff=diff;break;}
  persist();done++;qIdx++;revealed=false;renderFlash();
}

// ── QCM MODE ───────────────────────────────────────────────
function renderQCM(){
  var cc=document.getElementById('card-content');
  var pct=queue.length?Math.round(qcmIdx/queue.length*100):0;
  document.getElementById('pg-txt').textContent=qcmIdx+' / '+queue.length;
  document.getElementById('pg-pct').textContent=pct+'%';
  document.getElementById('pg-fl').style.width=pct+'%';

  if(qcmIdx>=queue.length){
    var pctScore=Math.round(qcmScore/queue.length*100);
    var emoji=pctScore>=80?'🏆':pctScore>=60?'👍':'💪';
    cc.innerHTML='<div class="qcm-score"><h2>'+emoji+' Résultat</h2>'
      +'<div class="score-ring">'+qcmScore+'/'+queue.length+'</div>'
      +'<p style="color:var(--sub);margin-bottom:16px">'+pctScore+'% de bonnes réponses</p>'
      +'<button class="nb pri" id="qcm-r">Recommencer</button></div>';
    document.getElementById('qcm-r').onclick=function(){buildQueue();renderQCM();};
    return;
  }
  var c=queue[qcmIdx];
  // build 4 options: 1 correct + 3 wrong from pool
  var wrong=[];
  for(var i=0;i<queue.length;i++){if(i!==qcmIdx)wrong.push(queue[i]);}
  shuffle(wrong);
  var opts=[c];
  for(var i=0;i<wrong.length&&opts.length<4;i++)opts.push(wrong[i]);
  shuffle(opts);
  var correctId=c.id;
  cc.innerHTML='<div class="qcm-q">'+c.q+'</div>'
    +'<div class="qcm-opts">'+opts.map(function(o,i){
      return'<button class="qcm-opt" data-oid="'+o.id+'" data-ci="'+i+'">'+o.a+'</button>';
    }).join('')+'</div>'
    +'<div class="nav"><button class="nb" id="qskip">Passer →</button></div>';
  cc.querySelectorAll('.qcm-opt').forEach(function(el){
    el.onclick=function(){
      if(this.disabled)return;
      cc.querySelectorAll('.qcm-opt').forEach(function(x){x.disabled=true;});
      var isRight=parseInt(this.getAttribute('data-oid'),10)===correctId;
      if(isRight){this.className='qcm-opt correct';qcmScore++;}
      else{
        this.className='qcm-opt wrong';
        cc.querySelectorAll('.qcm-opt').forEach(function(x){if(parseInt(x.getAttribute('data-oid'),10)===correctId)x.className='qcm-opt reveal';});
      }
      setTimeout(function(){qcmIdx++;renderQCM();},1100);
    };
  });
  document.getElementById('qskip').onclick=function(){qcmIdx++;renderQCM();};
}

// ── MATCH MODE ─────────────────────────────────────────────
function renderMatch(){
  var cc=document.getElementById('card-content');
  var pct=queue.length?Math.round(matchDone/queue.length*100):0;
  document.getElementById('pg-txt').textContent=matchDone+' / '+queue.length;
  document.getElementById('pg-pct').textContent=pct+'%';
  document.getElementById('pg-fl').style.width=pct+'%';

  if(matchDone>=queue.length){
    cc.innerHTML='<div class="done"><h2>🎉 Tout associé !</h2><p>'+queue.length+' paires trouvées</p><button class="nb pri" id="mr">Rejouer</button></div>';
    document.getElementById('mr').onclick=function(){buildQueue();matchDone=0;renderMatch();};
    return;
  }
  // take next batch of 4 (or fewer)
  var batch=[];
  for(var i=qIdx;i<queue.length&&batch.length<4;i++)batch.push(queue[i]);
  if(!batch.length){cc.innerHTML='<div class="done"><h2>Aucune carte</h2></div>';return;}

  selQ=null;selA=null;
  var qs=batch.slice();
  var as=shuffle(batch.slice().map(function(c){return{id:c.id,a:c.a};}));

  function buildMatch(){
    var qdone=qs.filter(function(c){return c._matched;}).map(function(c){return c.id;});
    cc.innerHTML='<div class="match-wrap">'
      +'<div class="match-score">'+qdone.length+' / '+qs.length+' paires trouvées</div>'
      +'<div class="match-grid">'
      +'<div class="match-side">'+qs.map(function(c){
        var matched=c._matched;
        var sel=selQ&&selQ.id===c.id;
        return'<div class="match-card q-card'+(matched?' matched':'')+(sel?' selected':'')+'" data-qid="'+c.id+'">'+c.q+'</div>';
      }).join('')+'</div>'
      +'<div class="match-side">'+as.map(function(a){
        var matched=a._matched;
        var sel=selA&&selA.id===a.id;
        return'<div class="match-card'+(matched?' matched':'')+(sel?' selected':'')+'" data-aid="'+a.id+'">'+a.a+'</div>';
      }).join('')+'</div>'
      +'</div></div>';

    cc.querySelectorAll('.q-card:not(.matched)').forEach(function(el){
      el.onclick=function(){
        selQ=null;
        qs.forEach(function(c){if(c.id===parseInt(el.getAttribute('data-qid'),10))selQ=c;});
        tryMatch();
      };
    });
    cc.querySelectorAll('.match-card:not(.q-card):not(.matched)').forEach(function(el){
      el.onclick=function(){
        selA=null;
        as.forEach(function(a){if(a.id===parseInt(el.getAttribute('data-aid'),10))selA=a;});
        tryMatch();
      };
    });
  }

  function tryMatch(){
    buildMatch();
    if(!selQ||!selA)return;
    if(selQ.id===selA.id){
      // correct!
      qs.forEach(function(c){if(c.id===selQ.id)c._matched=true;});
      as.forEach(function(a){if(a.id===selA.id)a._matched=true;});
      matchDone++;
      selQ=null;selA=null;
      buildMatch();
      // check if batch done
      var allDone=qs.every(function(c){return c._matched;});
      if(allDone){
        qIdx+=batch.length;
        qs.forEach(function(c){delete c._matched;});
        as.forEach(function(a){delete a._matched;});
        if(matchDone>=queue.length){renderMatch();}
        else{setTimeout(function(){renderMatch();},400);}
      }
    }else{
      // wrong — flash error
      var qel=cc.querySelector('[data-qid="'+selQ.id+'"]');
      var ael=cc.querySelector('[data-aid="'+selA.id+'"]');
      if(qel)qel.classList.add('error');
      if(ael)ael.classList.add('error');
      selQ=null;selA=null;
      setTimeout(function(){buildMatch();},700);
    }
  }
  buildMatch();
}

// ── ADD PANEL ──────────────────────────────────────────────
function renderAdd(){
  showPanel('add');
  var sel=document.getElementById('ns');sel.innerHTML='';
  subjects.forEach(function(s){var o=document.createElement('option');o.value=s.id;o.textContent=s.icon+' '+s.name;sel.appendChild(o);});
}

// ── MANAGE PANEL ───────────────────────────────────────────
function renderManage(){
  showPanel('manage');
  var fl=document.getElementById('mf-list');fl.innerHTML='';
  subjects.forEach(function(s){
    var ct=0;cards.forEach(function(c){if(c.sub===s.id)ct++;});
    var div=document.createElement('div');div.className='mfolder';
    div.innerHTML='<span class="mf-icon">'+s.icon+'</span><span class="mf-name">'+s.name+'</span><span class="mf-ct">'+ct+' cartes</span><button class="del" data-fid="'+s.id+'">✕</button>';
    fl.appendChild(div);
    div.querySelector('.del').onclick=function(){
      var fid=this.getAttribute('data-fid'),sv=findSub(fid);
      var ct2=0;cards.forEach(function(c){if(c.sub===fid)ct2++;});
      var msg='Supprimer "'+((sv?sv.name:fid))+'"'+(ct2>0?' et ses '+ct2+' cartes':'')+' ?';
      if(window.confirm(msg)){subjects=subjects.filter(function(x){return x.id!==fid;});cards=cards.filter(function(x){return x.sub!==fid;});persist();renderManage();toast('Supprimé !');}
    };
  });
  renderManageCards('');
}
function renderManageCards(search){
  var el=document.getElementById('mc-list'),filtered=[];
  var s=search.toLowerCase();
  cards.forEach(function(c){if(!s||c.q.toLowerCase().indexOf(s)!==-1||c.a.toLowerCase().indexOf(s)!==-1)filtered.push(c);});
  if(!filtered.length){el.innerHTML='<div style="text-align:center;padding:20px;color:var(--sub);font-size:.85rem">Aucune carte trouvée.</div>';return;}
  el.innerHTML='<div class="mlist">'+filtered.map(function(c){
    var sub=findSub(c.sub);
    return'<div class="mi"><div class="mq">'+c.q+'</div>'+(sub?'<span class="ms">'+sub.icon+'</span>':'')+'<span class="mb">'+c.deck+'</span><button class="edbtn" data-eid="'+c.id+'">✏️</button><button class="del" data-did="'+c.id+'">✕</button></div>';
  }).join('')+'</div>';
  el.querySelectorAll('.edbtn').forEach(function(b){b.onclick=function(){openEdit(parseInt(b.getAttribute('data-eid'),10));};});
  el.querySelectorAll('.del').forEach(function(b){b.onclick=function(){
    if(window.confirm('Supprimer cette carte ?')){cards=cards.filter(function(x){return x.id!==parseInt(b.getAttribute('data-did'),10);});persist();renderManage();toast('Supprimée !');}
  };});
}
function openEdit(cid){
  var c=null;cards.forEach(function(x){if(x.id===cid)c=x;});
  if(!c)return;
  var es=document.getElementById('es');es.innerHTML='';
  subjects.forEach(function(s){var o=document.createElement('option');o.value=s.id;o.textContent=s.icon+' '+s.name;if(s.id===c.sub)o.selected=true;es.appendChild(o);});
  document.getElementById('eid').value=c.id;
  document.getElementById('ed').value=c.deck;
  document.getElementById('eq').value=c.q;
  document.getElementById('ea').value=c.a;
  document.getElementById('ec').value=c.ctx||'';
  document.getElementById('modal-edit').className='overlay open';
}

// ── TOAST ──────────────────────────────────────────────────
function toast(msg){var el=document.getElementById('toast');el.textContent=msg;el.className='toast show';setTimeout(function(){el.className='toast';},2200);}

// ── WIRING ─────────────────────────────────────────────────
document.getElementById('t-study').onclick=function(){renderHome();};
document.getElementById('t-add').onclick=function(){renderAdd();};
document.getElementById('t-manage').onclick=function(){renderManage();};
document.getElementById('btn-all').onclick=function(){studyFilter=[];checkedSubs=[];startSession();};
document.getElementById('btn-sel').onclick=function(){studyFilter=checkedSubs.slice();checkedSubs=[];startSession();};
document.getElementById('btn-back').onclick=function(){renderHome();};

// mode chips
document.querySelectorAll('.mchip').forEach(function(el){
  el.onclick=function(){
    document.querySelectorAll('.mchip').forEach(function(x){x.className='mchip';});
    this.className='mchip on';
    mode=this.getAttribute('data-mode');
  };
});

// add card
document.getElementById('btn-save').onclick=function(){
  var sub=document.getElementById('ns').value,deck=document.getElementById('nd').value.trim(),q=document.getElementById('nq').value.trim(),a=document.getElementById('na').value.trim(),ctx=document.getElementById('nc').value.trim();
  if(!q||!a||!deck){toast('Remplis tous les champs !');return;}
  cards.push({id:Date.now(),sub:sub,deck:deck,q:q,a:a,ctx:ctx,diff:'new'});
  persist();
  ['nd','nq','na','nc'].forEach(function(id){document.getElementById(id).value='';});
  toast('Carte ajoutée !');renderHome();
};
document.getElementById('btn-cancel-add').onclick=function(){renderHome();};
document.getElementById('msearch').oninput=function(){renderManageCards(this.value);};
document.getElementById('btn-new-f-m').onclick=function(){document.getElementById('modal-folder').className='overlay open';};

// new folder modal
document.getElementById('btn-cf').onclick=function(){
  var name=document.getElementById('fn').value.trim(),icon=document.getElementById('fi').value.trim()||'📁';
  if(!name){toast('Donne un nom !');return;}
  subjects.push({id:'s'+Date.now(),name:name,icon:icon});persist();
  document.getElementById('modal-folder').className='overlay';
  document.getElementById('fn').value='';document.getElementById('fi').value='';
  renderHome();toast('Dossier créé !');
};
document.getElementById('btn-xf').onclick=function(){document.getElementById('modal-folder').className='overlay';};

// edit modal
document.getElementById('btn-se').onclick=function(){
  var cid=parseInt(document.getElementById('eid').value,10),sub=document.getElementById('es').value,deck=document.getElementById('ed').value.trim(),q=document.getElementById('eq').value.trim(),a=document.getElementById('ea').value.trim(),ctx=document.getElementById('ec').value.trim();
  if(!q||!a||!deck){toast('Remplis tous les champs !');return;}
  cards.forEach(function(c){if(c.id===cid){c.sub=sub;c.deck=deck;c.q=q;c.a=a;c.ctx=ctx;}});
  persist();document.getElementById('modal-edit').className='overlay';renderManage();toast('Carte modifiée !');
};
document.getElementById('btn-xe').onclick=function(){document.getElementById('modal-edit').className='overlay';};

// ── INIT ───────────────────────────────────────────────────
loadData();
checkedSubs=[];studyFilter=[];activeDeck='Tous';mode='flash';
queue=[];qIdx=0;revealed=false;done=0;qcmIdx=0;qcmScore=0;matchDone=0;
renderHome();
</script>
