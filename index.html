<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>My Flashcards — CAPES Anglais</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,600;1,400&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --pk:#e8a0b4;--pkl:#fbeef3;--pkd:#c75075;
  --gn:#8ecba0;--gnl:#e4f5ea;--gnd:#3d8a55;
  --ye:#f5d06e;--yel:#fdf6e3;--yed:#b8860b;
  --bg:#faf8f5;--srf:#ffffff;--txt:#1e1a18;--sub:#8a7f79;
  --bdr:#ede8e5;--r:16px;
}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;padding-bottom:100px}
.wrap{max-width:660px;margin:0 auto;padding:24px 14px 0}

/* ─ header */
.hdr{text-align:center;margin-bottom:20px}
.hdr h1{font-family:'Lora',Georgia,serif;font-size:1.85rem;color:var(--pkd);letter-spacing:-.3px}
.hdr p{font-size:.82rem;color:var(--sub);margin-top:4px}

/* ─ tabs */
.tabs{display:flex;gap:4px;background:var(--srf);border-radius:50px;padding:4px;margin-bottom:20px;box-shadow:0 2px 12px rgba(199,80,117,.1);border:1px solid var(--bdr)}
.tab{flex:1;padding:10px 6px;border:none;background:transparent;border-radius:50px;font-family:'Plus Jakarta Sans',sans-serif;font-size:.8rem;cursor:pointer;color:var(--sub);font-weight:500;transition:all .2s}
.tab.on{background:linear-gradient(135deg,var(--pk),#f7c3d5);color:var(--txt);font-weight:600;box-shadow:0 2px 8px rgba(199,80,117,.2)}

/* ─ stats bar */
.stats{display:flex;gap:8px;margin-bottom:16px}
.sp{flex:1;background:var(--srf);border-radius:14px;padding:11px 6px;text-align:center;border:1px solid var(--bdr)}
.sp .n{font-family:'Lora',serif;font-size:1.4rem;line-height:1}
.sp.pk .n{color:var(--pkd)}.sp.gn .n{color:var(--gnd)}.sp.gr .n{color:var(--sub)}
.sp .l{font-size:.68rem;color:var(--sub);margin-top:2px}

/* ─ buttons */
.btn-main{display:block;width:100%;padding:13px;background:linear-gradient(135deg,var(--pk),var(--gn));border:none;border-radius:14px;font-family:'Plus Jakarta Sans',sans-serif;font-size:.9rem;font-weight:600;cursor:pointer;margin-bottom:9px;color:var(--txt);box-shadow:0 3px 12px rgba(199,80,117,.15);transition:opacity .15s}
.btn-main:active{opacity:.88}
.btn-sel{display:none;width:100%;padding:12px;background:var(--srf);border:2px solid var(--pkd);border-radius:14px;font-family:'Plus Jakarta Sans',sans-serif;font-size:.88rem;font-weight:600;cursor:pointer;margin-bottom:12px;color:var(--pkd)}
.btn-sel.vis{display:block}

/* ─ mode picker */
.mode-row{display:flex;gap:7px;margin-bottom:16px}
.mchip{flex:1;padding:9px 4px;border-radius:12px;border:2px solid var(--bdr);background:var(--srf);font-family:'Plus Jakarta Sans',sans-serif;font-size:.75rem;cursor:pointer;color:var(--sub);font-weight:500;text-align:center;transition:all .18s}
.mchip.on{border-color:var(--pkd);color:var(--pkd);background:var(--pkl);font-weight:600}
.mchip .mi{font-size:1.1rem;display:block;margin-bottom:2px}

/* ─ folder grid */
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.fc{background:var(--srf);border-radius:var(--r);padding:18px 12px 14px;text-align:center;cursor:pointer;border:2px solid var(--bdr);transition:all .16s;position:relative}
.fc:active{transform:scale(.97)}
.fc.ck{border-color:var(--pkd);background:var(--pkl)}
.fch{position:absolute;top:9px;right:9px;width:20px;height:20px;border-radius:50%;border:2px solid var(--pk);background:var(--srf);display:flex;align-items:center;justify-content:center;font-size:10px;color:transparent;transition:all .16s}
.fch.on{background:var(--pkd);border-color:var(--pkd);color:#fff}
.fi{font-size:1.7rem;margin-bottom:5px}
.fn{font-family:'Lora',serif;font-size:.88rem;color:var(--txt)}
.fc2{font-size:.7rem;color:var(--sub);margin-top:2px}
.fp{margin-top:7px;height:4px;background:var(--pkl);border-radius:50px;overflow:hidden}
.fpf{height:100%;background:linear-gradient(90deg,var(--pk),var(--gn));border-radius:50px}
.add-fc{background:linear-gradient(135deg,var(--pkl),var(--gnl));border:2px dashed var(--pk);border-radius:var(--r);padding:18px 12px 14px;text-align:center;cursor:pointer}
.add-fc .fi{color:var(--pkd);font-size:1.2rem}
.add-fc .fn{color:var(--pkd);font-size:.82rem;font-family:'Plus Jakarta Sans',sans-serif;font-weight:600;margin-top:3px}

/* ─ deck chips */
.deck-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{padding:5px 12px;border-radius:50px;border:1.5px solid var(--bdr);background:var(--srf);font-size:.78rem;cursor:pointer;color:var(--sub);font-weight:500;transition:all .16s}
.chip.on{border-color:var(--pkd);color:var(--pkd);background:var(--pkl);font-weight:600}

/* ─ progress */
.pbar{margin-bottom:12px}
.plbl{display:flex;justify-content:space-between;font-size:.72rem;color:var(--sub);margin-bottom:3px}
.ptr{background:var(--bdr);border-radius:50px;height:6px;overflow:hidden}
.pfl{height:100%;background:linear-gradient(90deg,var(--pk),var(--gn));border-radius:50px;transition:width .35s}

/* ─ breadcrumb */
.bc{display:flex;gap:6px;align-items:center;margin-bottom:12px;font-size:.82rem;color:var(--sub);flex-wrap:wrap}
.bch{background:var(--pkl);border:none;cursor:pointer;color:var(--pkd);font-family:'Plus Jakarta Sans',sans-serif;font-size:.78rem;font-weight:600;padding:5px 12px;border-radius:50px}

/* ─ FLASHCARD mode */
.card-box{background:var(--srf);border-radius:20px;padding:30px 20px;text-align:center;min-height:175px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;margin-bottom:12px;border:1.5px solid var(--bdr);box-shadow:0 3px 20px rgba(0,0,0,.06);transition:transform .1s}
.card-box:active{transform:scale(.99)}
.card-box.back{background:linear-gradient(160deg,var(--gnl),#edf8f1);border-color:var(--gn)}
.cq{font-family:'Lora',serif;font-size:1.08rem;line-height:1.55;margin-bottom:8px;font-weight:600}
.chint{font-size:.75rem;color:var(--sub)}
.ca{font-size:.9rem;line-height:1.7}
.ctx{display:block;font-size:.74rem;color:#6aaa7e;font-style:italic;margin-top:10px;padding-top:10px;border-top:1px solid rgba(142,203,160,.4);text-align:center;width:100%}
.abts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:11px}
.ab{padding:10px 4px;border:none;border-radius:12px;font-family:'Plus Jakarta Sans',sans-serif;font-size:.8rem;font-weight:600;cursor:pointer;transition:transform .1s}
.ab:active{transform:scale(.96)}
.ab.hard{background:var(--pkl);color:var(--pkd)}.ab.medium{background:var(--yel);color:var(--yed)}.ab.easy{background:var(--gnl);color:var(--gnd)}
.nav{display:flex;gap:8px;justify-content:center;margin-top:4px}
.nb{padding:8px 18px;border-radius:50px;border:1.5px solid var(--pk);background:var(--srf);cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;font-size:.8rem;color:var(--txt);font-weight:500}
.nb.pri{background:linear-gradient(135deg,var(--pk),var(--gn));border-color:transparent;font-weight:600}

/* ─ QCM mode */
.qcm-q{font-family:'Lora',serif;font-size:1.05rem;line-height:1.55;text-align:center;padding:22px 16px;background:var(--srf);border-radius:18px;margin-bottom:13px;border:1.5px solid var(--bdr);font-weight:600}
.qcm-opts{display:flex;flex-direction:column;gap:9px;margin-bottom:12px}
.qcm-opt{padding:13px 16px;background:var(--srf);border:2px solid var(--bdr);border-radius:14px;cursor:pointer;font-size:.88rem;line-height:1.45;text-align:left;font-family:'Plus Jakarta Sans',sans-serif;transition:all .15s}
.qcm-opt:active{transform:scale(.99)}
.qcm-opt.correct{border-color:var(--gnd);background:var(--gnl);color:var(--gnd);font-weight:600}
.qcm-opt.wrong{border-color:var(--pkd);background:var(--pkl);color:var(--pkd)}
.qcm-opt.reveal{border-color:var(--gnd);background:var(--gnl)}
.qcm-score{text-align:center;background:var(--srf);border-radius:20px;padding:38px 20px;border:1.5px solid var(--bdr)}
.qcm-score h2{font-family:'Lora',serif;font-size:1.5rem;margin-bottom:6px}
.score-ring{width:90px;height:90px;border-radius:50%;margin:16px auto;display:flex;align-items:center;justify-content:center;font-family:'Lora',serif;font-size:1.6rem;font-weight:600;border:4px solid var(--gnd);color:var(--gnd)}

/* ─ MATCHING mode */
.match-wrap{margin-bottom:12px}
.match-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.match-side{display:flex;flex-direction:column;gap:8px}
.match-card{padding:11px 10px;border-radius:13px;border:2px solid var(--bdr);background:var(--srf);font-size:.78rem;line-height:1.4;cursor:pointer;transition:all .2s;min-height:54px;display:flex;align-items:center;font-family:'Plus Jakarta Sans',sans-serif;overflow:hidden}
.match-card.q-card{background:linear-gradient(135deg,#fdf2f6,#fff);border-color:var(--pk);font-weight:600;font-family:'Lora',serif;font-size:.8rem}
.match-card.selected{border-color:var(--pkd);background:var(--pkl);transform:scale(1.02)}
.match-card.matched{border-color:var(--gnd);background:var(--gnl);color:var(--gnd);opacity:.7;cursor:default}
.match-card.error{border-color:var(--pkd);background:var(--pkl);animation:shake .3s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.match-score{text-align:center;padding:8px 0;font-size:.82rem;color:var(--sub)}

/* ─ done screen */
.done{text-align:center;background:var(--srf);border-radius:20px;padding:40px 20px;border:1.5px solid var(--bdr)}
.done h2{font-family:'Lora',serif;font-size:1.4rem;color:var(--gnd);margin-bottom:6px}
.done p{color:var(--sub);margin-bottom:16px;font-size:.88rem}

/* ─ ADD panel */
.panel{background:var(--srf);border-radius:var(--r);padding:20px 16px;border:1px solid var(--bdr);margin-bottom:12px}
.panel h2{font-family:'Lora',serif;font-size:1.1rem;color:var(--pkd);margin-bottom:13px}
.fr{margin-bottom:10px}
.fr label{display:block;font-size:.7rem;font-weight:600;color:var(--sub);margin-bottom:3px;text-transform:uppercase;letter-spacing:.04em}
.fr input,.fr textarea,.fr select{width:100%;padding:9px 11px;border:1.5px solid var(--bdr);border-radius:11px;font-family:'Plus Jakarta Sans',sans-serif;font-size:.87rem;color:var(--txt);background:var(--bg);resize:vertical;outline:none}
.fr input:focus,.fr textarea:focus,.fr select:focus{border-color:var(--pk)}
.fr textarea{min-height:68px}
.si{width:100%;padding:9px 13px;border:1.5px solid var(--bdr);border-radius:50px;font-family:'Plus Jakarta Sans',sans-serif;font-size:.85rem;color:var(--txt);background:var(--srf);outline:none;margin-bottom:12px}
.si:focus{border-color:var(--pk)}
.fbtns{display:flex;gap:7px;margin-top:12px}
.bpri{flex:1;padding:11px;background:linear-gradient(135deg,var(--pk),var(--gn));border:none;border-radius:11px;font-family:'Plus Jakarta Sans',sans-serif;font-size:.88rem;font-weight:600;cursor:pointer;transition:opacity .15s}
.bpri:active{opacity:.88}
.bsec{padding:11px 14px;background:var(--srf);border:1.5px solid var(--bdr);border-radius:11px;font-family:'Plus Jakarta Sans',sans-serif;font-size:.88rem;cursor:pointer;color:var(--sub)}

/* ─ MANAGE panel */
.mfolder{background:var(--srf);border-radius:12px;padding:10px 13px;display:flex;align-items:center;gap:9px;border:1px solid var(--bdr);margin-bottom:7px}
.mf-icon{font-size:1.2rem;flex-shrink:0}
.mf-name{flex:1;font-weight:600;font-size:.87rem}
.mf-ct{font-size:.72rem;color:var(--sub);flex-shrink:0}
.mlist{display:flex;flex-direction:column;gap:7px}
.mi{background:var(--srf);border-radius:12px;padding:10px 12px;display:flex;align-items:center;gap:8px;border:1px solid var(--bdr)}
.mq{flex:1;font-size:.81rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mb{font-size:.64rem;background:var(--pkl);color:var(--pkd);padding:2px 7px;border-radius:50px;white-space:nowrap;font-weight:500;flex-shrink:0}
.ms{font-size:.64rem;background:var(--gnl);color:var(--gnd);padding:2px 7px;border-radius:50px;white-space:nowrap;flex-shrink:0}
.del{background:none;border:none;cursor:pointer;color:#d4b4bc;font-size:.9rem;flex-shrink:0;padding:2px}
.del:active{color:var(--pkd)}
.edbtn{background:none;border:none;cursor:pointer;color:var(--sub);font-size:.9rem;flex-shrink:0;padding:2px}

/* ─ modals */
.overlay{display:none;position:fixed;inset:0;background:rgba(30,26,24,.45);z-index:100;align-items:flex-start;justify-content:center;padding-top:70px;overflow-y:auto}
.overlay.open{display:flex}
.modal{background:var(--srf);border-radius:20px;padding:22px;width:92%;max-width:370px;box-shadow:0 8px 40px rgba(0,0,0,.16);margin-bottom:40px}
.modal h3{font-family:'Lora',serif;font-size:1.05rem;color:var(--pkd);margin-bottom:12px}

/* ─ toast */
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--txt);color:#fff;padding:8px 20px;border-radius:50px;font-size:.81rem;transition:transform .3s cubic-bezier(.34,1.56,.64,1);z-index:200;pointer-events:none}
.toast.show{transform:translateX(-50%) translateY(0)}
@media(max-width:400px){.abts{grid-template-columns:1fr}.hdr h1{font-size:1.55rem}}
</style>
</head>
<body>
<div class="wrap">
<div class="hdr"><h1>✿ My Flashcards</h1><p>CAPES Anglais · Tous tes cours</p></div>

<div class="tabs">
  <button class="tab on" id="t-study">📖 Réviser</button>
  <button class="tab" id="t-add">＋ Ajouter</button>
  <button class="tab" id="t-manage">⊞ Gérer</button>
</div>

<!-- STUDY HOME -->
<div id="panel-study">
  <div class="stats">
    <div class="sp pk"><div class="n" id="st-tot">-</div><div class="l">Total</div></div>
    <div class="sp gn"><div class="n" id="st-ok">-</div><div class="l">Maîtrisées</div></div>
    <div class="sp gr"><div class="n" id="st-due">-</div><div class="l">À revoir</div></div>
  </div>

  <!-- mode picker -->
  <div class="mode-row">
    <button class="mchip on" data-mode="flash"><span class="mi">🃏</span>Flashcards</button>
    <button class="mchip" data-mode="qcm"><span class="mi">🎯</span>QCM</button>
    <button class="mchip" data-mode="match"><span class="mi">🔗</span>Associer</button>
  </div>

  <button class="btn-main" id="btn-all">Tout réviser</button>
  <button class="btn-sel" id="btn-sel">✓ Étudier la sélection (0)</button>
  <div class="fg" id="fg"></div>
</div>

<!-- ADD -->
<div id="panel-add" style="display:none">
  <div class="panel">
    <h2>Nouvelle carte ✦</h2>
    <div class="fr"><label>Dossier</label><select id="ns"></select></div>
    <div class="fr"><label>Deck / Thème</label><input id="nd" type="text" placeholder="Ex: Brexit, Phonologie…"/></div>
    <div class="fr"><label>Question</label><textarea id="nq" placeholder="Ex: What year was the Good Friday Agreement?"></textarea></div>
    <div class="fr"><label>Réponse</label><textarea id="na" placeholder="Ex: 1998 — signed April 10th…"></textarea></div>
    <div class="fr"><label>Note (optionnel)</label><input id="nc" type="text" placeholder="Ex: Key for Part 2 oral"/></div>
    <div class="fbtns">
      <button class="bpri" id="btn-save">Ajouter</button>
      <button class="bsec" id="btn-cancel-add">Annuler</button>
    </div>
  </div>
</div>

<!-- MANAGE -->
<div id="panel-manage" style="display:none">
  <div class="panel">
    <p style="font-family:'Lora',serif;font-size:1rem;font-weight:600;margin-bottom:10px">🗂 Dossiers</p>
    <div id="mf-list"></div>
    <button class="bsec" id="btn-new-f-m" style="width:100%;margin-top:6px">+ Nouveau dossier</button>
  </div>
  <div class="panel">
    <p style="font-family:'Lora',serif;font-size:1rem;font-weight:600;margin-bottom:10px">🃏 Cartes</p>
    <input class="si" id="msearch" type="text" placeholder="Rechercher une carte…"/>
    <div id="mc-list"></div>
  </div>
</div>

<!-- CARDS VIEW -->
<div id="panel-cards" style="display:none">
  <div class="bc">
    <button class="bch" id="btn-back">🏠 Accueil</button>
    <span id="bc-sub"></span>
  </div>
  <div class="stats">
    <div class="sp pk"><div class="n" id="cs-tot">0</div><div class="l">Cartes</div></div>
    <div class="sp gn"><div class="n" id="cs-ok">0</div><div class="l">Maîtrisées</div></div>
    <div class="sp gr"><div class="n" id="cs-due">0</div><div class="l">À revoir</div></div>
  </div>
  <div class="deck-row" id="deck-row"></div>
  <div class="pbar"><div class="plbl"><span id="pg-txt">0 / 0</span><span id="pg-pct">0%</span></div><div class="ptr"><div class="pfl" id="pg-fl" style="width:0%"></div></div></div>
  <div id="card-content"></div>
</div>
</div>

<!-- NEW FOLDER MODAL -->
<div class="overlay" id="modal-folder">
  <div class="modal">
    <h3>Nouveau dossier</h3>
    <div class="fr"><label>Nom</label><input id="fn" type="text" placeholder="Ex: Grammaire…"/></div>
    <div class="fr"><label>Emoji</label><input id="fi" type="text" placeholder="📖" maxlength="8"/></div>
    <div class="fbtns">
      <button class="bpri" id="btn-cf">Créer</button>
      <button class="bsec" id="btn-xf">Annuler</button>
    </div>
  </div>
</div>

<!-- EDIT CARD MODAL -->
<div class="overlay" id="modal-edit">
  <div class="modal">
    <h3>Modifier la carte</h3>
    <input type="hidden" id="eid"/>
    <div class="fr"><label>Dossier</label><select id="es"></select></div>
    <div class="fr"><label>Deck</label><input id="ed" type="text"/></div>
    <div class="fr"><label>Question</label><textarea id="eq"></textarea></div>
    <div class="fr"><label>Réponse</label><textarea id="ea"></textarea></div>
    <div class="fr"><label>Note</label><input id="ec" type="text"/></div>
    <div class="fbtns">
      <button class="bpri" id="btn-se">Enregistrer</button>
      <button class="bsec" id="btn-xe">Annuler</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── DATA ──────────────────────────────────────────────────
var SUBJECTS=[
  {id:'s1',name:'Civi britannique',icon:'🇬🇧'},
  {id:'s2',name:'Civi américaine',icon:'🇺🇸'},
  {id:'s3',name:'Enjeux contemporains',icon:'🌱'},
  {id:'s4',name:'Littérature',icon:'📚'},
  {id:'s5',name:'Langue',icon:'✏️'}
];
var CARDS=[
{id:1,sub:'s1',deck:'Brexit',q:'What date was the Brexit referendum and what was the result?',a:'June 23, 2016. 51.9% Leave vs 48.1% Remain. Cameron resigned the next morning.',ctx:'Core date — always know this.',diff:'new'},
{id:2,sub:'s1',deck:'Brexit',q:'When did the UK officially leave the EU and under whose slogan?',a:'January 31, 2020. Transition period until December 31, 2020. Johnson\'s slogan: "Get Brexit Done".',ctx:'4 years of political chaos between the vote and exit.',diff:'new'},
{id:3,sub:'s1',deck:'Brexit',q:'Why did people vote Leave? Give 4 reasons.',a:'Sovereignty ("Take Back Control" — 55% of UK laws came from Brussels). Immigration fears post-2004 EU enlargement. Economic frustration after 2008 recession. Identity: nostalgia for British independence.',ctx:'Understanding motivations matters more than just the result.',diff:'new'},
{id:4,sub:'s1',deck:'Brexit',q:'What was the "£350 million per week" claim and why is it the most documented lie of the campaign?',a:'The Leave red bus claimed the UK sent £350m/week to the EU and that money would fund the NHS. False — real net figure was ~£180m (Thatcher\'s rebate wasn\'t deducted). The UK Statistics Authority called it misleading. Farage admitted it was wrong the morning after the vote.',ctx:'Key example for "Bregret" — a deliberate lie, not just an error.',diff:'new'},
{id:5,sub:'s1',deck:'Brexit',q:'What is Article 50 and what happened when May tried to use Royal Prerogative to trigger it?',a:'Article 50 (added by Lisbon Treaty 2007) is the EU exit mechanism — a 2-year countdown once triggered. May wanted to invoke it without Parliament. Supreme Court ruled 8-3 (January 2017): she could not — rights given by Parliament can only be removed by Parliament.',ctx:'May finally triggered Article 50 in March 2017 after Parliament approved.',diff:'new'},
{id:6,sub:'s1',deck:'Brexit',q:'Why did Parliament reject May\'s Withdrawal Agreement three times?',a:'Three incompatible factions: Remainers found it too harsh. Hard Brexiteers found it too soft. DUP rejected it because it kept Northern Ireland aligned with EU rules, creating a de facto Irish Sea border.',ctx:'May survived an internal Conservative confidence vote (200 vs 117) but resigned in tears May 2019.',diff:'new'},
{id:7,sub:'s1',deck:'Brexit',q:'What is the Windsor Framework (2023)?',a:'Sunak\'s renegotiation of the Northern Ireland Protocol. Keeps NI aligned with EU single market (avoiding a land border with the Republic). Creates a green lane (goods staying in NI, light checks) and red lane (goods going to Republic/EU, full checks) at Irish Sea ports.',ctx:'DUP still opposed it as it symbolically separates NI from the rest of the UK.',diff:'new'},
{id:8,sub:'s1',deck:'Brexit',q:'What are the main economic consequences of Brexit?',a:'GDP fell 5.5%, investment 11%, trade with EU 15-16%. Labour shortage: 330,000 missing agricultural workers, $27m of unharvested crops (2022). Car production fell to 40% of pre-Covid levels. UK lost access to SIS II anti-terrorism database.',ctx:'Recession + inflation + wage freezes = the conditions for "Bregret".',diff:'new'},
{id:9,sub:'s1',deck:'Brexit',q:'What is "Bregret" and what statistic illustrates it?',a:'"Bregret" = Brexit + Regret. 79% of young voters entering the electorate would vote to rejoin Europe. Dissatisfied Britons jumped from 21% (June 2021) to 45% quickly. Former "Leavers" becoming "Rejoiners".',ctx:'The title of Fiche 60 — the central concept for the oral.',diff:'new'},
{id:10,sub:'s1',deck:'Brexit',q:'What is the Lisbon Treaty (2007) and what crucial clause did it add?',a:'Signed 2007, entered force 2009. Reformed EU governance after 2004 enlargement (15 → 25 members). Crucially added Article 50 — the EU exit mechanism. Without Lisbon, Brexit would have had no legal framework. Chain: Lisbon → Cameron promises referendum → 2016 vote → Brexit.',ctx:'Cameron\'s promise of a referendum was partly a response to Labour signing Lisbon without asking the people.',diff:'new'},
{id:11,sub:'s1',deck:'Histoire GB',q:'What was the Witenagemot and what were the key constitutional milestones to 1689?',a:'Witenagemot: Anglo-Saxon "meeting of wise men" — ancestor of Parliament. Magna Carta (1215): king not above the law, taxes need Parliament\'s approval, free men judged by peers. Provisions of Oxford (1258): Parliament meets 3x/year without royal summons — first independent legislature. Habeas Corpus (1679): no detention without court appearance in 3 days. Bill of Rights (1689): Parliament supreme, free elections, free speech.',ctx:'Golden thread: power gradually transferred from monarch → Parliament → people.',diff:'new'},
{id:12,sub:'s1',deck:'Histoire GB',q:'What were cottage industries and why did the Luddites revolt?',a:'Cottage industries: families making goods by hand at home (wool, fabric, shoes). Industrial Revolution made factory machines 100× more productive — millions lost income overnight. Luddites were desperate workers who destroyed machines. The government made industrial sabotage a capital crime — 24 men executed.',ctx:'Chain: cottage industry → Industrial Revolution → urbanisation → poverty → workers\' rights.',diff:'new'},
{id:13,sub:'s1',deck:'Histoire GB',q:'What was the Blitz (1940-41) and what national identity did it forge?',a:'German Luftwaffe bombing campaign, Sept 1940 – May 1941. London bombed 57 consecutive nights. 43,000 civilians killed, 1.1 million homes destroyed. Completely backfired — instead of breaking morale, it united the population. The "Blitz spirit" — British resilience and defiance — became a foundational national myth still invoked today.',ctx:'"Blitz" from German "Blitzkrieg" (lightning war). Churchill\'s speeches embodied this spirit.',diff:'new'},
{id:14,sub:'s1',deck:'Histoire GB',q:'What did the Reform Acts (1832-1928) progressively expand?',a:'1832: wealthy middle-class men. 1867: working men who owned or rented property and paid local rates. 1884: near-universal male suffrage. 1918: women over 30. 1928: Equal Franchise Act — all women over 21. 1969: voting age lowered from 21 to 18.',ctx:'Democracy in Britain was handed out in tiny pieces, grudgingly, each time only when pressure from below became impossible to ignore.',diff:'new'},
{id:15,sub:'s1',deck:'Monarchie',q:'What are the monarch\'s theoretical powers vs real powers?',a:'Theory: dissolve Parliament, declare war, appoint PM, veto laws, appoint judges, grant pardons, sign treaties. Reality: ALL exercised by the PM in the king\'s name. Bagehot: the monarch has three rights — "to be consulted, to encourage, to warn". Not to rule.',ctx:'The last monarch to refuse Royal Assent was Queen Anne in 1708 (Scottish Militia Bill).',diff:'new'},
{id:16,sub:'s1',deck:'Monarchie',q:'What are the Royal Assent formulas and the Sovereign Grant?',a:'Royal Assent in Norman French: "La Reyne le veult" (approved) / "La Reyne s\'avisera" (veto — unused since 1708). Sovereign Grant: 25% of Crown Estate profits, totalling £86.3m for 2021-22 = £1.29/British person/year. Crown Estate ceded by George III in 1760. Duchy of Lancaster = king\'s private income, £650m+ worth, ~£24m/year.',ctx:'Two income streams: public (Sovereign Grant from Crown Estate) and private (Duchy of Lancaster).',diff:'new'},
{id:17,sub:'s1',deck:'Monarchie',q:'How does a British MP formally resign and what is the Fountain of Justice?',a:'An MP cannot simply resign. Must request appointment as Crown Steward of the Chiltern Hundreds — a medieval fictional post — which creates legal incompatibility with being an MP, triggering a by-election. Fountain of Justice: all courts are "The King\'s courts", cases are "The King versus…", the king holds the personal prerogative of pardon — but follows the Home Secretary\'s advice.',ctx:'Pure legal fiction from 1624 — nobody has ever abolished the rule.',diff:'new'},
{id:18,sub:'s1',deck:'Monarchie',q:'What is the Privy Council and what are Orders in Council?',a:'743-member council of royal advisers (all current + former ministers, archbishops, Speaker). Meets monthly. Orders in Council = legally binding decisions made without Parliament — a legal shortcut via royal prerogative. NOT secret — reported daily in the Court Circular. When a monarch dies, an Accession Council meets at St James\'s Palace in two parts.',ctx:'Heath used royal prerogative to join the EEC in 1973 without Parliament. Thatcher for the Falklands 1982.',diff:'new'},
{id:19,sub:'s1',deck:'Systeme politique UK',q:'What is the first-past-the-post system and why does the shape of the Commons chamber matter?',a:'First-past-the-post: the candidate with the most votes wins — even without absolute majority. Structurally advantages large parties. The rectangular Commons chamber (government vs opposition face-to-face) physically reinforces the two-party system. Compare with French hemicycle which favours coalitions.',ctx:'Result: UK politics dominated by two parties even when the country is deeply divided (as in Brexit).',diff:'new'},
{id:20,sub:'s1',deck:'Systeme politique UK',q:'What is the Shadow Cabinet and how does an MP resign?',a:'Shadow Cabinet: the "phantom government" of the opposition — each minister has a shadow counterpart. Shadow PM = Leader of the Opposition, paid extra salary. An MP cannot simply resign since 1624 — must request appointment as Crown Steward of the Chiltern Hundreds (medieval fictional post) from the Chancellor of the Exchequer to trigger a by-election.',ctx:'Once an MP always an MP — until you take on a fictional medieval appointment.',diff:'new'},
{id:21,sub:'s1',deck:'Systeme politique UK',q:'What are the Blair reforms to the House of Lords (1999 and 2005/2009)?',a:'1999 House of Lords Act: stripped 750 hereditary peers of automatic right to sit. A compromise left 92 elected by their peers temporarily. 2005 Constitutional Reform Act (effective 2009): created UK Supreme Court, separating judiciary from Parliament. Also reformed the Lord Chancellor who had previously held legislative + executive + judicial roles simultaneously.',ctx:'Before 2009: Law Lords both made laws AND judged cases — a fundamental violation of separation of powers.',diff:'new'},
{id:22,sub:'s1',deck:'Systeme politique UK',q:'What is the Parliament Act 1911 and what are Life Peers?',a:'Parliament Act 1911 (under Asquith): Lords can only delay a bill by 2 years max, after which it passes automatically. Life Peerages Act 1958: PM nominates ~20 Lords/year for life — title does not pass to children. Currently 781 Lords (92 hereditary, ~670 life peers, 2 archbishops + 24 bishops).',ctx:'Lords are appointed by the PM — a democratic problem that Blair never fully resolved.',diff:'new'},
{id:23,sub:'s1',deck:'Ecosse',q:'Key Scottish dates: Bannockburn, Act of Union, Scotland Act, indyref.',a:'1314 Battle of Bannockburn: Robert the Bruce crushes English — decisive Scottish independence. 1328 Treaty of Northampton: England formally recognises independence. 1603: James VI of Scotland becomes James I of England — personal union only. 1707 Act of Union: parliaments merge at Westminster — Scotland keeps its Church, legal system, banknotes. 1998 Scotland Act: Holyrood Parliament (129 MSPs) created. 2014: indyref — 55% No.',ctx:'Scottish banknotes are in pounds sterling, but English shops can legally refuse them.',diff:'new'},
{id:24,sub:'s1',deck:'Ecosse',q:'The Stone of Scone — what happened in 1296, 1950 and 1996?',a:'Edward I stole it in 1296 and placed it under Westminster Abbey\'s coronation throne. In 1950, four Scottish nationalist students broke in and took it back — it was recovered 4 months later. John Major returned it officially in 1996 — 700 years after the theft. It was temporarily brought to London for Charles III\'s coronation.',ctx:'A physical symbol of 400 years of Anglo-Scottish tension, in one sandstone block.',diff:'new'},
{id:25,sub:'s1',deck:'Ecosse',q:'Why did Brexit turbocharge Scottish independence demands?',a:'In 2016, 62% of Scots voted Remain — but were taken out of the EU against their will. SNP argument: "In 2014 you said independence meant leaving the EU. We voted No to stay in the EU. Now we\'re out anyway." Supreme Court ruled November 2022: Scotland cannot hold a referendum without Westminster\'s agreement. Nicola Sturgeon resigned February 2023.',ctx:'The 2014 No vote was partly won on the EU membership argument — Brexit made it collapse.',diff:'new'},
{id:26,sub:'s1',deck:'Commonwealth',q:'What are the Balfour Report (1926), Statute of Westminster (1931), Singapore Declaration (1971) and Harare Declaration (1991)?',a:'Balfour Report (1926): UK and Dominions declared equal in status. Statute of Westminster (1931): formal autonomy to Dominions. Singapore Declaration (1971): first rulebook — voluntary, consensual, anti-colonialism. Harare Declaration (1991/1995): added democracy, human rights, gender equality — AND a suspension mechanism (teeth).',ctx:'Before 1995: no consequences for violations. After 1995: Nigeria suspended 1995, Pakistan 1999, Zimbabwe 2002.',diff:'new'},
{id:27,sub:'s1',deck:'Commonwealth',q:'What was the Windrush Generation and the Windrush Scandal?',a:'Windrush Generation: Caribbean migrants 1948-1971. Empire Windrush arrived June 1948 with 492 passengers. Many never received proper paperwork. 2010: Home Office destroyed their landing cards. Under May\'s "hostile environment" policy, at least 83 people wrongly deported. They had lived and worked legally for decades but were told to "prove" their right to stay.',ctx:'The hostile environment policy was created by May as Home Secretary — before she became PM.',diff:'new'},
{id:28,sub:'s1',deck:'Irlande',q:'What was the Plantation of Ulster (1609) and why does it still define Irish politics?',a:'English king sent Protestant settlers from England and Scotland to colonize six Ulster counties while Irish Catholics were expelled from their land. This artificially created the fundamental North (Protestant/British) vs South (Catholic/Irish) divide that still exists. One act in 1609 created 400 years of conflict.',ctx:'The six counties that became Northern Ireland are the legacy of this 1609 plantation.',diff:'new'},
{id:29,sub:'s1',deck:'Irlande',q:'What was the Easter Rising (1916) and why was the British response catastrophic?',a:'Easter Monday 1916: ~1200 Irish Volunteers occupied key Dublin buildings. Patrick Pearse proclaimed the Irish Republic from the General Post Office. After 5 days, surrender. 15 leaders executed — including wounded James Connolly, shot tied to a chair. This transformed unpopular rebels into martyrs and radicalized Irish opinion. Sinn Fein ("We Ourselves") won 73 parliamentary seats in 1918.',ctx:'The execution was the British government\'s biggest political mistake in Ireland.',diff:'new'},
{id:30,sub:'s1',deck:'Irlande',q:'Bloody Sunday 1920 vs Bloody Sunday 1972 — what happened?',a:'Bloody Sunday 1920 (Nov 21): IRA killed 14 British intelligence agents. Black and Tans retaliated by firing into a Gaelic football crowd at Croke Park — 12 spectators killed. Bloody Sunday 1972 (Jan 30): British paratroopers killed 13 Catholic civilians during a peaceful civil rights march in Londonderry. 1972 saw 468 deaths total — peak of the Troubles.',ctx:'Two traumatic days, 52 years apart — both emblematic of the cycle of violence.',diff:'new'},
{id:31,sub:'s1',deck:'Irlande',q:'What did the Good Friday Agreement (1998) create?',a:'Signed April 10, 1998 — Good Friday — mediated by US Senator George Mitchell. Stormont Assembly with mandatory power-sharing: unionists and nationalists MUST govern together. If one First Minister resigns, the Deputy must also resign. Invisible border guaranteed. 71% Yes in NI, 94% Yes in Republic. IRA ended armed activities 2005.',ctx:'3600 dead, 30,000+ injured over 30 years of Troubles — the GFA was an extraordinary achievement.',diff:'new'},
{id:32,sub:'s1',deck:'Irlande',q:'How did Brexit threaten the Good Friday Agreement and what is the Sinn Fein/DUP situation today?',a:'Brexit created EU/non-UK border in middle of Ireland. Northern Ireland Protocol: NI stays in EU single market (invisible land border), but creates Irish Sea trade barrier — green lanes and red lanes. May 2022: Sinn Fein won NI elections for FIRST TIME since 1921 (27 vs 25 DUP). Fine Gael and Fianna Fail born from the 1921-23 Irish civil war over the partition treaty.',ctx:'Fine Gael = pro-treaty descendants. Fianna Fail = anti-treaty. They allied in 2020 to exclude Sinn Fein from power.',diff:'new'},
{id:33,sub:'s1',deck:'Figures cles GB',q:'William the Conqueror — key facts.',a:'Battle of Hastings, October 14, 1066 — last successful invasion of England. Crowned Westminster Abbey, Christmas Day 1066. Domesday Book (1086): complete land census for taxation — first of its kind. Created the Exchequer (accounting on a checkered board — still the title of Chancellor of the Exchequer). French words entered English: beef/ox, pork/pig, mutton/sheep.',ctx:'The Norman Conquest reset British history — monarchy numbering restarts from 1 with William.',diff:'new'},
{id:34,sub:'s1',deck:'Figures cles GB',q:'Henry VIII and Oliver Cromwell — key paradoxes.',a:'Henry VIII: named "Fidei Defensor" (FD on British coins today) by the Pope for defending Catholicism — then broke with Rome in 1534 to divorce Catherine of Aragon. Created the Church of England for personal reasons, not religious conviction. Cromwell: killed the king for tyranny, then became a tyrant himself — theatres closed, Christmas banned, Ireland brutally suppressed.',ctx:'Both men are walking paradoxes — perfect examples for the oral.',diff:'new'},
{id:35,sub:'s1',deck:'Figures cles GB',q:'Nelson and Churchill — key facts.',a:'Nelson: lost right eye 1794 (Toulon), lost right arm 1797 (Canaries). Trafalgar Oct 21, 1805: with 27 ships defeated 33 Franco-Spanish ships — saved Britain from Napoleonic invasion, died in battle on HMS Victory. Churchill: 60 years as MP, directed WWII from Cabinet War Rooms, lost 1945 election, "Iron curtain" speech 1946, Nobel Prize in Literature 1953, resigned 1955 after a stroke.',ctx:'Both iconic symbols of British resilience — central to the "Blitz spirit" national identity.',diff:'new'},
{id:36,sub:'s1',deck:'Figures cles GB',q:'Elizabeth I and Queen Victoria — key facts.',a:'Elizabeth I: last Tudor, Religious Settlement 1559, Elizabethan Golden Age (Shakespeare), Spanish Armada destroyed 1588, "Virgin Queen", executed Mary Queen of Scots 1587 — whose son became James I. Victoria: reigned 63 years, Albert died 1861, isolated for decades → triggered only republican sentiment since Cromwell, Empress of India 1876, Great Exhibition 1851.',ctx:'Victoria\'s isolation taught the monarchy that public visibility is essential for survival.',diff:'new'},
{id:37,sub:'s1',deck:'Figures cles GB',q:'Florence Nightingale and the Suffragettes — key facts.',a:'Nightingale: "Lady with the Lamp" in Crimea (1854), but also produced a 1000-page statistical report — practically invented epidemiology. Founded Nightingale Training School 1860. First woman to receive Order of Merit (1907). Suffragettes: Pankhurst founded WSPU 1903 ("Deeds not Words"). Emily Davison threw herself under the king\'s horse at Epsom Derby 1913. Women over 30 got vote 1918. Equal Franchise Act 1928.',ctx:'2000 suffragettes escorted Davison\'s coffin draped in purple, white and green.',diff:'new'},
{id:38,sub:'s1',deck:'Figures cles GB',q:'Margaret Thatcher — policy and divided legacy.',a:'Oxford chemistry → barrister → Conservative MP 1959 → first woman to lead a British political party (1975) → PM 1979. Thatcherism: privatisation, union-busting (miners\' strike 1984-85), Falklands War 1982, sold council housing, poll tax 1990 → riots → forced to resign. Won 3 consecutive elections. Death in 2013: state mourning AND street parties in mining towns.',ctx:'No British politician divides opinion as much — except perhaps Cromwell.',diff:'new'},
{id:39,sub:'s1',deck:'Peinture GB',q:'Hogarth and the Reynolds vs Gainsborough rivalry.',a:'Hogarth (1697-1764): first great British painter — rejected portraits of the rich to paint the sordid reality of London. A Harlot\'s Progress (6 paintings: girl becomes prostitute) and A Rake\'s Progress (8 paintings: heir ends in asylum). Every detail symbolic. Reynolds (1723-1792): Royal Academy president (1768), said blue was too cold. Gainsborough (1727-1788): painted The Blue Boy — an artistic middle finger to Reynolds.',ctx:'A rivalry between two egos produced one of the most famous British paintings in history.',diff:'new'},
{id:40,sub:'s1',deck:'Peinture GB',q:'Constable vs Turner — what makes each revolutionary?',a:'Constable (1776-1837): painted en plein air (in nature) when everyone used studios. The Haywain. His obsession with clouds (father owned windmills) inspired Monet — precursor of Impressionism. Turner (1775-1851): genius of light and abstraction. Rain Steam and Speed, The Fighting Temeraire. Incomprehensible to contemporaries. Bequeathed all works to the nation on condition they stay together (now Tate Britain).',ctx:'Constable = earth, landscape, reality. Turner = light, chaos, proto-abstraction.',diff:'new'},
{id:41,sub:'s1',deck:'Peinture GB',q:'Pre-Raphaelites (1848) and the Young British Artists.',a:'Pre-Raphaelite Brotherhood 1848: wanted to return to sincerity of painters before Raphael — vibrant colors, obsessive detail. Rossetti: wife died of laudanum overdose, he buried his manuscripts with her then had them dug up. Burne-Jones worked with William Morris (Arts and Crafts). YBAs: Tracey Emin — My Bed (unmade bed with detritus as art). Damien Hirst — shark in formaldehyde, For the Love of God (skull with 8601 diamonds).',ctx:'"The hipsters of 1848" vs the provocateurs of the 1980s — both rejecting the mainstream.',diff:'new'},
{id:42,sub:'s1',deck:'Peinture GB',q:'Key 20th century British artists and sculptors.',a:'Francis Bacon (1909-1992): tortured figures in confined spaces, crucifixion triptychs, anxiety of modernity. Lucian Freud (1922-2011): grandson of Sigmund, hyper-realist portraits — controversial portrait of Queen Elizabeth II. David Hockney (1937-): Pop Art swimming pools, Yorkshire landscapes, A Year in Normandie (90m iPad frieze inspired by Bayeux Tapestry). Gormley: Angel of the North (20m high, 54m wingspan). Kapoor: Cloud Gate Chicago.',ctx:'British art: tension between tradition and transgression, from Hogarth to Hirst.',diff:'new'},
{id:43,sub:'s1',deck:'Medias GB',q:'Broadsheets vs tabloids — key newspapers and Murdoch\'s empire.',a:'Quality: The Times (1785, "The Thunderer", Murdoch 1981, 495K, pro-Conservative), Financial Times (1888, salmon pink paper, pro-European, 189K), The Guardian (Scott Trust — no shareholders, 112K). Tabloids: Daily Mail (910K, anti-immigration). Red-tops: The Sun (Murdoch, 1.3M, Page Three Girl 1970-2015, anti-EU). Murdoch owns: The Times, Sunday Times, The Sun, BSkyB — vast influence over British opinion.',ctx:'Fleet Street was the hub of British press — all newspapers have now relocated to East London.',diff:'new'},
{id:44,sub:'s1',deck:'Medias GB',q:'BBC funding and the phone-hacking scandal.',a:'BBC funded by licence fee: £159/year for anyone with a TV-capable device. Free for 75+, 50% off for blind. Budget: £5.1bn, of which £3.7bn from licence fee. 2022: fee frozen → BBC World Service cut 382 jobs and 10 language services. News of the World (Murdoch, founded 1843): closed 2011 after journalists hacked celebrities\', politicians\', and crime victims\' phones — 168-year-old institution destroyed.',ctx:'BBC English = Received Pronunciation until the 1980s, when regional accents became acceptable.',diff:'new'},
{id:45,sub:'s1',deck:'Gun Control GB',q:'Hungerford (1987) and Dunblane (1996) — UK response.',a:'Hungerford 1987: gunman with 3 legal semi-automatic rifles killed 16 → Parliament immediately banned all semi-automatic rifles (1988). Dunblane 1996: gunman entered a primary school gym, killed 16 children aged 4-5 and their teacher → 1997 Firearms Act banned virtually ALL handguns. 162,000 weapons and 700 tonnes of ammunition collected in buyback programme costing £168m.',ctx:'The UK\'s response to mass shootings: immediate, comprehensive legislation.',diff:'new'},
{id:46,sub:'s2',deck:'Race et Civil Rights',q:'Plessy v. Ferguson (1896) vs Brown v. Board (1954) — what changed?',a:'Plessy v. Ferguson (1896): Supreme Court upheld "separate but equal" — legalizing racial segregation. Brown v. Board of Education (1954): overturned Plessy — school segregation declared unconstitutional. Argued by NAACP lawyer Thurgood Marshall (later first Black Supreme Court justice). Civil Rights Act (1964): outlawed discrimination based on race, color, religion, sex, national origin. Voting Rights Act (1965). Fair Housing Act (1968) banned redlining.',ctx:'Redlining: denying mortgages to people in racially defined neighborhoods — its legacy is today\'s racial wealth gap.',diff:'new'},
{id:47,sub:'s2',deck:'Race et Civil Rights',q:'MLK\'s "I Have a Dream" — date, context, significance.',a:'August 28, 1963. March on Washington: 250,000 people. King used the LANGUAGE of the American Dream to expose its hypocrisy — claiming it for those it excluded. MLK assassinated April 4, 1968 in Memphis. The 13th Amendment (1865) abolished slavery EXCEPT as punishment for crime — enabling prison labor, the cornerstone of the prison-industrial complex debate.',ctx:'George Floyd murdered May 25, 2020 → global BLM protests in 60+ countries. Chauvin convicted April 2021.',diff:'new'},
{id:48,sub:'s2',deck:'Race et Civil Rights',q:'What is systemic racism and what happened in 2023 with affirmative action?',a:'Systemic racism = racism embedded in institutions, laws, social systems — not just individual prejudice. Manifests in policing, housing, healthcare, education. SFFA v. Harvard (2023): Supreme Court ruled race-conscious admissions unconstitutional, effectively ending affirmative action in higher education — reversing decades of precedent.',ctx:'Distinguish individual racism (person-level) from systemic/structural racism.',diff:'new'},
{id:49,sub:'s2',deck:'Democratie US',q:'The three branches of US government and checks and balances.',a:'Legislative: Congress (100-seat Senate + 435-seat House of Representatives). Executive: President + Cabinet. Judicial: Supreme Court + federal courts. Impeachment: House votes by simple majority; Senate needs 2/3 to convict. Trump was impeached twice (2019, 2021) but not convicted.',ctx:'Madison\'s design: separation of powers + checks and balances — prevent tyranny.',diff:'new'},
{id:50,sub:'s2',deck:'Democratie US',q:'What is the Electoral College and why is it controversial?',a:'538 electors formally elect the President (270 needed). Allocated per state. Winner-takes-all in most states. In 2000 (Bush over Gore) and 2016 (Trump over Clinton), the popular vote winner LOST the Electoral College. Critics argue it distorts democratic will.',ctx:'A candidate can win the presidency while losing the popular vote by millions.',diff:'new'},
{id:51,sub:'s2',deck:'Democratie US',q:'Filibuster and gerrymandering — what are they?',a:'Filibuster: prolonged Senate debate to delay/block legislation. Requires 60 votes (cloture) to end. Named after Dutch "vrijbuiter" (pirate). Used to block civil rights bills for decades. Gerrymandering: manipulating district boundaries to favor a party. Named after Governor Elbridge Gerry of Massachusetts (1812) whose district looked like a salamander.',ctx:'Both parties gerrymander. Both mechanisms undermine democratic fairness.',diff:'new'},
{id:52,sub:'s2',deck:'Democratie US',q:'The Bill of Rights (1791) — key amendments.',a:'First 10 amendments to the Constitution. 1st: freedom of speech, religion, press, assembly. 2nd: right to bear arms. 4th: protection against unreasonable searches. 5th: right to not self-incriminate. 6th: right to jury trial. Added to reassure anti-Federalists that individual rights would be protected.',ctx:'All inspired by English precedents: Magna Carta, Habeas Corpus, Bill of Rights 1689.',diff:'new'},
{id:53,sub:'s2',deck:'Gun Control US',q:'What does the 2nd Amendment say and why is it so difficult to overturn?',a:'"A well regulated Militia…the right of the people to keep and bear Arms, shall not be infringed." (1791). To amend it: 2/3 majority in BOTH chambers of Congress AND ratification by 38 of 50 states. Only 13 states need to say No to block it — many more than 13 are deeply pro-gun. 276 out of 535 Congress members have accepted NRA funding.',ctx:'Mathematically possible to change. Politically near-impossible.',diff:'new'},
{id:54,sub:'s2',deck:'Gun Control US',q:'Key US mass shootings and the legislative non-response.',a:'Columbine 1999: 12 students, 1 teacher. Virginia Tech 2007: 32 dead. Sandy Hook 2012: 20 children aged 6-7, 6 adults. After Sandy Hook: 1500 gun laws proposed, 109 passed — but 70 of those 109 RELAXED existing restrictions. Uvalde 2022: 19 children. NRA (founded 1871, political force since 1970s): 5+ million members, dominates Congress.',ctx:'Brady Act (1993): first mandatory background checks. But private sales remain exempt.',diff:'new'},
{id:55,sub:'s2',deck:'Reve Americain',q:'What is the philosophical foundation of the American Dream?',a:'Declaration of Independence (Thomas Jefferson, 1776): "Life, liberty and the pursuit of happiness." Note: the RIGHT TO PURSUE happiness — not the guarantee of it. The state ensures freedom to try, not the result. The Puritans first: John Winthrop\'s "City upon a Hill" (1630) — America as the world\'s perfect model.',ctx:'Protestant work ethic: hard work = honoring God = material success = divine blessing.',diff:'new'},
{id:56,sub:'s2',deck:'Reve Americain',q:'Key self-made men — what were their trajectories?',a:'Vanderbilt: quit school at 11, bought ferry with borrowed money, built railroad empire. Carnegie: emigrated from Scotland at 13, cotton mill → Carnegie Steel. Rockefeller: bookkeeper at 16 → Standard Oil monopoly. Lincoln: born in log cabin, less than 1 year of formal education → President of the United States.',ctx:'Benjamin Franklin: "Early to bed and early to rise makes a Man healthy, wealthy, and wise."',diff:'new'},
{id:57,sub:'s2',deck:'Reve Americain',q:'What are the main critiques of the American Dream?',a:'Great Depression (1929): millions worked hard and lost everything through systemic failure — not individual failure. Black Americans were legally excluded from the Dream (Jim Crow, redlining, educational barriers). MLK\'s speech used the Dream\'s language to expose its hypocrisy. 59% of Americans now believe their children will struggle to climb the social ladder. Life expectancy: 76 years (lowest since 1990s).',ctx:'Jeremy Rifkin (The European Dream): the European model of social safety nets is now more attractive.',diff:'new'},
{id:58,sub:'s2',deck:'Immigration US',q:'The Melting Pot vs the Salad Bowl — what is the difference?',a:'Melting Pot: immigrants abandon their original identity and assimilate into a single American identity — the 19th-century ideal. Salad Bowl (Cultural Mosaic): immigrants retain their culture while coexisting — a multicultural society. The US today is closer to the Salad Bowl. The Statue of Liberty (1886, gift from France): "Give me your tired, your poor, your huddled masses yearning to be free."',ctx:'Legal immigration: 1 million/year. Millions more try to enter illegally.',diff:'new'},
{id:59,sub:'s2',deck:'Histoire US',q:'What was 9/11 and its main political consequences?',a:'September 11, 2001: Al-Qaeda hijacked 4 planes — two hit the World Trade Center, one the Pentagon, one crashed in Pennsylvania. ~3000 deaths. Led to: USA PATRIOT Act (expanded surveillance), Department of Homeland Security created, wars in Afghanistan (2001) and Iraq (2003), the "War on Terror" reshaping US foreign and domestic policy for decades.',ctx:'The defining event of the early 21st century — the consequences are still felt today.',diff:'new'},
{id:60,sub:'s3',deck:'Crise climatique',q:'Paris Agreement (2015), COP26 (2021) and Net Zero.',a:'Paris Agreement: 196 parties, limit warming to 1.5-2°C above pre-industrial levels via nationally determined contributions. US withdrew under Trump (2020), rejoined under Biden (2021). COP26: Glasgow 2021, targeted coal phase-down. Net Zero: balancing emissions emitted with those removed. UK committed to net zero by 2050 (Climate Change Act, amended 2019).',ctx:'IPCC (founded 1988): assesses global climate science — its reports drive COP targets.',diff:'new'},
{id:61,sub:'s3',deck:'Crise climatique',q:'What is greenwashing and what was Fridays for Future?',a:'Greenwashing: marketing that makes a company appear more environmentally friendly than it is. A form of deception undermining genuine climate action. Fridays for Future: launched by Greta Thunberg in August 2018 — striking every Friday from school. "How dare you" speech at UN General Assembly 2019. 4 million people struck in September 2019 across 161 countries.',ctx:'Ofcom and Advertising Standards Authority increasingly cracking down on greenwashing in the UK.',diff:'new'},
{id:62,sub:'s3',deck:'Medias et democratie',q:'Echo chambers, the Overton Window and Cambridge Analytica.',a:'Echo chamber: people only encounter views confirming their own — algorithms amplify this. Overton Window: range of ideas deemed acceptable in mainstream discourse — shifting it normalizes fringe ideas. Cambridge Analytica (2018): harvested 87 million Facebook users\' data without consent for targeted political ads in Brexit campaign and Trump\'s 2016 election. Zuckerberg testified before Congress.',ctx:'Echo chambers + confirmation bias = radicalization pipeline. Central to "Fictions et réalités".',diff:'new'},
{id:63,sub:'s4',deck:'The Tempest',q:'Prospero, Caliban and Ariel — colonial reading.',a:'Prospero: exiled Duke of Milan, uses magic to control island — represents colonial power, the European claiming "civilising" authority. Caliban: island\'s native, enslaved, dispossessed — the colonised subject, capable of resistance. His name = anagram of "Cannibal". "You taught me language, and my profit on it is I know how to curse." Ariel: compliant colonial subject (accommodation vs Caliban\'s rebellion).',ctx:'Terra Nullius: Prospero treats the island as empty — but Caliban\'s mother Sycorax was already there.',diff:'new'},
{id:64,sub:'s4',deck:'Poesie',q:'Iambic pentameter — what is it and what\'s the difference between Shakespearean and Petrarchan sonnets?',a:'Iambic pentameter: 5 iambs per line (da-DUM × 5), 10 syllables, closest to natural English speech. Shakespearean sonnet: 14 lines, ABAB CDCD EFEF GG — 3 quatrains + a couplet that provides a twist. Petrarchan sonnet: octave (ABBAABBA) + sestet (CDECDE) — the turn comes at the 9th line.',ctx:'"Shall I compare THEE to a SUM-mer\'s DAY" — 5 iambs, 10 syllables.',diff:'new'},
{id:65,sub:'s5',deck:'Phonologie',q:'What is assimilation and elision in connected speech?',a:'Assimilation: a sound changes under influence of a neighbour. "Ten boys" → "tem boys" (n → m before bilabial b). Elision: omission of a sound. "Next day" → "neks day" (t dropped). Linking: consonant links to following vowel ("turn off" → "tur-noff"). Intrusive r: "law and order" → "law-r-and order".',ctx:'These three processes make connected speech sound natural — key for English phonology exam.',diff:'new'},
{id:66,sub:'s5',deck:'Grammaire',q:'Present perfect vs preterite and "must" vs "have to".',a:'Present perfect: past event with present relevance or unspecified time ("I have seen it"). Preterite: completed event at a specific past time ("I saw it yesterday"). Must: internal obligation or logical deduction ("You must be tired"). Have to: external obligation from rules ("I have to work — it\'s the law"). Epistemic must = deduction; deontic must = obligation.',ctx:'Common French speaker error: using passé composé where English requires the preterite.',diff:'new'},
{id:67,sub:'s1',deck:'Irlande',q:'What was the Grande Famine (1845-1848) and the Fenian Brotherhood?',a:'Potato blight destroyed the staple food. 1 million died. Millions emigrated (population: 8m → 4m). British government accused of criminal inaction while food continued being exported from Ireland. The famine fueled nationalism. Fenian Brotherhood (1848, James Stephens): committed to independence by force — named after legendary Irish warriors.',ctx:'The famine is seen as proof that British rule = death for Ireland.',diff:'new'},
{id:68,sub:'s1',deck:'Ecosse',q:'Mary Queen of Scots and the Act of Union (1707) — what was the deal?',a:'Mary Queen of Scots: Catholic queen, 6 days old when she became queen. Sent to France, married the dauphin (briefly Queen of France). Returned to Scotland, forced to abdicate, fled to England, imprisoned 19 years by Elizabeth I, beheaded 1587. Her son became James I of England. Act of Union 1707: Scotland kept its Church (Presbyterian, not Anglican), legal system, and the right to print its own banknotes.',ctx:'Scottish banknotes today: Bank of Scotland, Royal Bank of Scotland, Clydesdale Bank — all technically refusable in England.',diff:'new'},
{id:69,sub:'s2',deck:'Democratie US',q:'US healthcare and the political parties\' coalitions.',a:'US is one of few wealthy nations without universal healthcare. Based on private insurance — millions uninsured. Obamacare (Affordable Care Act 2010) expanded coverage but was bitterly contested. Democrats: urban voters, minorities, educated whites, young people — support healthcare, climate action. Republicans: rural, white working class, evangelicals — lower taxes, less regulation, 2nd Amendment.',ctx:'Life expectancy: 76 years (US) vs 81+ (UK, France, Germany) — healthcare system partly to blame.',diff:'new'},
{id:70,sub:'s1',deck:'Monarchie',q:'What happened when Barbados became a republic (2021) and what is the Commonwealth Games quirk?',a:'Barbados removed the Queen as head of state in 2021. Prince Charles acknowledged "the appalling atrocity of slavery" — without reparations. Many Caribbean nations began questioning Commonwealth membership. Commonwealth Games quirk: although the UK is one Commonwealth member, it competes as FOUR separate teams (England, Scotland, Wales, Northern Ireland) — unlike the Olympics.',ctx:'The death of Elizabeth II (2022) raised serious questions about the Commonwealth\'s future under Charles III.',diff:'new'},

// ── CHRONOLOGIE BRETAGNE — Dates clés (Fiche 41) ──────────
{id:71,sub:'s1',deck:'Dates cles GB',q:'55 BC / 43 AD / 122 AD — what happened?',a:'55 BC: Julius Caesar first arrives in Britain. 43 AD: Emperor Claudius completes the Roman conquest — Romans build Londinium (London). 122 AD: Emperor Hadrian orders construction of Hadrian\'s Wall across northern England to keep Scottish (Pictish) tribes out.',ctx:'Britain\'s first experience of centralised power — the Roman model of roads, towns, and administration.',diff:'new'},
{id:72,sub:'s1',deck:'Dates cles GB',q:'1066 — what three things did William the Conqueror do?',a:'October 14, 1066: Battle of Hastings — last successful invasion of England. Christmas Day 1066: crowned at Westminster Abbey. 1086: commissioned the Domesday Book (complete land census for taxation). Also created the Exchequer (tax accounts kept on a chequered board — still the title of the Chancellor today).',ctx:'Anglo-Norman French became the language of the nobility for 300 years.',diff:'new'},
{id:73,sub:'s1',deck:'Dates cles GB',q:'1215, 1258, 1628 — what are these three constitutional documents?',a:'1215 Magna Carta: King John Lackland forced to sign at Runnymede — king not above law, taxes need Parliament\'s approval, free men judged by peers. Pope Innocent III annulled it, but the ideas survived. 1258 Provisions of Oxford: Henry III forced by barons (led by Simon de Montfort) — Parliament meets 3×/year without royal summons. 1628 Petition of Rights: Charles I forbidden to imprison without cause or levy taxes without Parliament.',ctx:'Three documents, three centuries — each one clipping royal power a little more.',diff:'new'},
{id:74,sub:'s1',deck:'Dates cles GB',q:'1642-1660 — the Civil War and its aftermath.',a:'1642: Civil War begins — Cavaliers (Charles I) vs Roundheads (Cromwell\'s Parliament). Cromwell\'s Ironsides cavalry win at Marston Moor (1644) and Naseby (1645). 1649: Charles I captured, tried, executed — the ONLY time the British monarchy was broken. Cromwell becomes Lord Protector. 1658: Cromwell dies. 1660: monarchy restored under Charles II.',ctx:'Cromwell\'s republic was called the "Commonwealth" — nothing to do with today\'s Commonwealth of Nations.',diff:'new'},
{id:75,sub:'s1',deck:'Dates cles GB',q:'1679, 1689 — Habeas Corpus and the Bill of Rights.',a:'1679 Habeas Corpus Act (under Charles II): no one can be detained without being brought before a court within 3 days. 1689 Bill of Rights (William III and Mary II): limits sovereign power, establishes free elections, freedom of speech, bans cruel punishment — the monarch cannot rule without Parliament. Both directly inspired the American Constitution.',ctx:'William III became king as a gift of Parliament — the first time Parliament chose its monarch.',diff:'new'},
{id:76,sub:'s1',deck:'Dates cles GB',q:'1832 / 1867 / 1884 / 1918 / 1928 / 1969 — what is the Reform Acts timeline?',a:'1832: wealthy middle-class men. 1867: working men who owned or rented and paid local taxes (rates). 1884: near-universal male suffrage. 1918: women over 30. 1928 Equal Franchise Act: women over 21 (all women). 1969 Representation of the People Act: voting age lowered from 21 to 18.',ctx:'"Democracy handed out in tiny pieces, grudgingly, each time only when pressure from below was irresistible."',diff:'new'},

// ── CHRONOLOGIE MONARCHIE — Dates clés (Fiche 40) ─────────
{id:77,sub:'s1',deck:'Dates cles GB',q:'1534, 1536-40, 1760, 1708 — monarchie et lois clés.',a:'1534 Act of Supremacy: Henry VIII breaks with Rome, becomes head of Church of England. 1536-40: Dissolution of the Monasteries — their wealth enriched the Crown. 1760: George III cedes Crown Estate to Parliament in exchange for annual Civil List allowance. 1708: Queen Anne last uses Royal Assent veto (Scottish Militia Bill) — never used since.',ctx:'The Church of England was created for a divorce, not theological conviction.',diff:'new'},
{id:78,sub:'s1',deck:'Dates cles GB',q:'1911 Parliament Act — what did it change about the House of Lords?',a:'Under PM Asquith: the Lords can no longer block legislation indefinitely — they can only DELAY a bill by 2 years. After 2 years, the bill passes automatically without Lords\' approval. This ended the Lords\' absolute veto. Previously, the Lords had repeatedly blocked the Irish Home Rule Bill (1893, 1913). Also established that the Parliament lasts maximum 5 years.',ctx:'This reform was triggered by the Lords blocking Lloyd George\'s "People\'s Budget" of 1909.',diff:'new'},
{id:79,sub:'s1',deck:'Dates cles GB',q:'1958, 1999, 2005/2009 — the three key reforms of the House of Lords.',a:'1958 Life Peerages Act: PM can now nominate ~20 Lords/year for life — title does not pass to children. 1999 House of Lords Act (Blair): stripped 750 hereditary peers of their automatic right to sit — only 92 remain, elected by their peers. 2005/2009 Constitutional Reform Act (Blair): created UK Supreme Court, separating judiciary from Parliament. Lord Chancellor\'s triple role split.',ctx:'Before 2009: Law Lords both made laws AND judged cases — fundamental violation of separation of powers.',diff:'new'},

// ── CHRONOLOGIE ÉCOSSE — Dates clés (Fiche 61) ─────────────
{id:80,sub:'s1',deck:'Dates cles Ecosse',q:'80 AD to 1413 — the Scottish timeline, key dates.',a:'80 AD: Romans try to conquer Scotland but fail. 122 AD: Hadrian\'s Wall built to contain the Picts. 6th century: Irish Celts called "Scots" invade — giving Scotland its name. 1296: Edward I steals the Stone of Scone. 1305: William Wallace executed. 1306: Robert the Bruce crowned King of Scotland. 1314 Battle of Bannockburn: Bruce crushes the English. 1328 Treaty of Northampton: England formally recognises Scottish independence. 1413: St Andrews University founded (oldest in Scotland).',ctx:'Scotland was fully independent from 1328 to 1603.',diff:'new'},
{id:81,sub:'s1',deck:'Dates cles Ecosse',q:'1542 to 1707 — Mary Queen of Scots to the Act of Union.',a:'1542: Mary Queen of Scots becomes queen at 6 days old. She marries the French Dauphin (briefly Queen of France). 1567: forced to abdicate. 1587: Elizabeth I has her executed after 19 years of imprisonment. 1603: Mary\'s son James VI of Scotland inherits the English throne = James I (personal union only). 1707 Act of Union: parliaments merge at Westminster — Scotland loses its parliament but keeps its Church, legal system, and banknotes.',ctx:'Irony: Elizabeth killed the mother; the mother\'s line won the throne.',diff:'new'},
{id:82,sub:'s1',deck:'Dates cles Ecosse',q:'1746, 1950, 1996, 1998, 2014, 2015, 2016, 2022, 2023 — modern Scottish dates.',a:'1746 Culloden: Jacobite cause crushed — last pitched battle on British soil. 1950: students steal Stone of Scone from Westminster. 1996: John Major returns it officially. 1998 Scotland Act: Holyrood Parliament (129 MSPs) created. 2004: inaugurated by Elizabeth II. 2014: independence referendum — 55% No. 2015: voting age lowered to 16 for Scottish elections. 2016: 62% Scots vote Remain. 2022: Supreme Court blocks indyref2. 2023: Nicola Sturgeon resigns.',ctx:'The 2014 No vote was partly won by arguing independence meant leaving the EU. Brexit collapsed that argument.',diff:'new'},

// ── CHRONOLOGIE COMMONWEALTH — Dates clés (Fiche 53) ───────
{id:83,sub:'s1',deck:'Dates cles Commonwealth',q:'1884 to 1948 — Commonwealth origins timeline.',a:'1884: Lord Rosebury first uses "Commonwealth of Nations" to describe the British Empire. 1917: Jan Smuts (South Africa) formally suggests the name. 1926 Balfour Report: UK and Dominions declared equal in status — not subordinate. 1931 Statute of Westminster: grants full autonomy to Dominions (Australia, Canada, Ireland, New Zealand, South Africa). 1932: Commonwealth Preference trade system established. June 22, 1948: Empire Windrush arrives with 492 Caribbean passengers — start of Windrush Generation.',ctx:'The Balfour Report is the birth certificate of the modern Commonwealth.',diff:'new'},
{id:84,sub:'s1',deck:'Dates cles Commonwealth',q:'1965 to 2022 — the Commonwealth\'s modern milestones.',a:'1965: Commonwealth Secretariat established at Marlborough House, London. 1971 Singapore Declaration: first official rulebook — voluntary, consensual, anti-colonialist. 1991/1995 Harare Declaration: adds democracy, human rights, gender equality + suspension mechanism. 2010: Home Office destroys Windrush landing cards. 2018: Windrush Scandal exposed (83+ wrongly deported). 2021: Barbados becomes republic. September 8, 2022: Elizabeth II dies — 70 years as Commonwealth head.',ctx:'Nigeria suspended 1995-99. Pakistan 1999-2004. Zimbabwe 2002.',diff:'new'},

// ── CHRONOLOGIE IRLANDE — Dates clés (Fiche 58) ────────────
{id:85,sub:'s1',deck:'Dates cles Irlande',q:'12th century to 1800 — Irish history key dates.',a:'12th century: Henry II sends Anglo-Norman troops — first English colonisation around Dublin. 1609 Plantation of Ulster: Protestant settlers from England and Scotland replace Catholic Irish landowners — creates the North/South divide. 1641: 12,000 Protestant settlers killed in Catholic uprising. 1649: Cromwell massacres Irish — deportations, land confiscation. 1690 Battle of the Boyne: William III defeats Catholic James II — Protestant supremacy established. 1695 Penal Laws: Catholics cannot vote, own land, practice their religion. 1795: Orange Order founded. 1800 Act of Union: Ireland\'s Parliament abolished, becomes part of the UK.',ctx:'One policy — the Plantation of Ulster — created 400 years of conflict.',diff:'new'},
{id:86,sub:'s1',deck:'Dates cles Irlande',q:'1845-1916 — Famine, Home Rule, Easter Rising.',a:'1845-1848 Grande Famine: potato blight kills 1 million, population falls from 8M to 4M, millions emigrate. 1848: Fenian Brotherhood founded (independence by force). 1893 and 1913: Home Rule Bill passed by Commons but vetoed by Lords twice. Easter Monday 1916: Irish Volunteers occupy the General Post Office in Dublin. After 5 days, 15 leaders executed (including James Connolly, shot in a chair).',ctx:'The executions transformed unpopular rebels into martyrs — the British\'s worst political mistake in Ireland.',diff:'new'},
{id:87,sub:'s1',deck:'Dates cles Irlande',q:'1918-1937 — from independence war to the Irish Free State.',a:'1918: Sinn Fein wins 73 seats, forms the Dail Eireann (own parliament), declares independence. 1919-1921: War of Independence — IRA vs Black and Tans. November 21, 1920 Bloody Sunday: IRA kills 14 British agents; Black and Tans retaliate, kill 12 spectators at Croke Park. 1921 Anglo-Irish Treaty: partition — 26 counties (Irish Free State) + 6 counties (Ulster stays British). 1922-23: Irish Civil War (pro- vs anti-Treaty). 1922: Irish Free State. 1937: De Valera renames it Éire with a new constitution.',ctx:'Fine Gael = pro-Treaty. Fianna Fáil = anti-Treaty. Rivals for 100 years.',diff:'new'},
{id:88,sub:'s1',deck:'Dates cles Irlande',q:'1949-1972 — from Republic to the start of the Troubles.',a:'Easter Monday 1949: Republic of Ireland officially proclaimed — leaves the Commonwealth. 1968: First civil rights march in Derry violently dispersed by the RUC — Troubles begin. 1969: British Army deployed in Northern Ireland after anti-Catholic violence. January 30, 1972 Bloody Sunday: British paratroopers kill 13 Catholic civilians during a peaceful march in Londonderry. 1972: 468 deaths — peak of the Troubles. Direct Rule from London: Stormont suspended.',ctx:'The Troubles were inspired by the US civil rights movement — Catholics demanding equal rights.',diff:'new'},
{id:89,sub:'s1',deck:'Dates cles Irlande',q:'1973-1993 — peace attempts and atrocities.',a:'1973 Sunningdale Agreement: first attempt at power-sharing — fails in 1974 due to Protestant workers\' strike. 1979: IRA assassinates Lord Mountbatten (uncle of Prince Philip) AND Airey Neave (killed in the House of Commons car park). 1981: Bobby Sands — first of 10 IRA hunger strikers to die at Maze Prison. 1984: Brighton bomb narrowly misses Thatcher. 1993 Downing Street Declaration: Major + Irish Taoiseach Reynolds — opens door to Sinn Fein participation in talks. 1994: IRA ceasefire declared.',ctx:'3600 dead, 30,000+ injured over 30 years of conflict.',diff:'new'},
{id:90,sub:'s1',deck:'Dates cles Irlande',q:'1998-2023 — the Good Friday Agreement and Brexit.',a:'April 10, 1998 Good Friday Agreement: power-sharing at Stormont, invisible border, mediated by US Senator George Mitchell — 71% Yes NI, 94% Yes Republic. August 15, 1998 Omagh bombing: Real IRA car bomb kills 29 (9 children) — the worst single atrocity of the Troubles. 2005: IRA formally ends armed activities. 2007: British military operations end. 2020: Northern Ireland Protocol. February 2022: DUP quits power-sharing. May 2022: Sinn Fein wins NI elections for first time since 1921 (27 vs 25 seats). February 2023: Windsor Framework.',ctx:'Sinn Fein\'s first electoral victory since 1921 — a historic shift.',diff:'new'},

// ── FIGURES CLÉS — Dates précises (Fiches 48/49) ───────────
{id:91,sub:'s1',deck:'Figures cles GB dates',q:'William the Conqueror (1027-1087) — key dates.',a:'1066 Oct 14: Battle of Hastings. 1066 Dec 25: crowned Westminster Abbey. 1086: Domesday Book commissioned. Created the Exchequer. Introduced feudalism and French language into England.',ctx:'Last successful invasion of England — no foreign power has conquered Britain since.',diff:'new'},
{id:92,sub:'s1',deck:'Figures cles GB dates',q:'Henry VIII (1491-1547) — key dates.',a:'1509: becomes king. 1534 Act of Supremacy: becomes head of Church of England (breaks with Rome over divorce from Catherine of Aragon). 1536-40: dissolution of all monasteries — wealth enriched the Crown. 1536 and 1542 Acts of Union: Wales united with England. The Pope had named him "Fidei Defensor" (FD still on British coins).',ctx:'Created the Church of England for personal reasons — one of history\'s greatest institutional consequences of a marital dispute.',diff:'new'},
{id:93,sub:'s1',deck:'Figures cles GB dates',q:'Oliver Cromwell (1599-1658) — key dates.',a:'1640: elected to Parliament. 1644 Marston Moor, 1645 Naseby: decisive Roundhead victories. 1649: Charles I executed — Cromwell becomes Lord Protector of the Commonwealth. 1649-50: brutally suppresses Irish resistance. 1658: dies. 1660: monarchy restored under Charles II — his son Richard had no political authority.',ctx:'The man who killed the king for tyranny became a dictator himself — the paradox of revolution.',diff:'new'},
{id:94,sub:'s1',deck:'Figures cles GB dates',q:'Horatio Nelson (1758-1805) — key dates.',a:'1794: loses right eye at Toulon. 1797: loses right arm at the Canaries — same year beats Franco-Spanish fleet at Cape St Vincent. 1798 Battle of the Nile (Abukir Bay): destroys French fleet, stops Napoleon in Egypt. October 21, 1805 Battle of Trafalgar: with 27 ships defeats 33 Franco-Spanish ships — saves Britain from Napoleonic invasion, dies on HMS Victory. 1849: Nelson\'s Column erected at Trafalgar Square.',ctx:'He fought and won with one eye and one arm — the ultimate British resilience symbol.',diff:'new'},
{id:95,sub:'s1',deck:'Figures cles GB dates',q:'Winston Churchill (1874-1965) — key dates.',a:'1900: elected Conservative MP. 1940 May: replaces Chamberlain as PM — directs war from Cabinet War Rooms. 1941: warns of "iron curtain" dividing Europe (full speech 1946). 1945: LOSES election to Labour despite winning WWII. 1951: returns to power. 1953: Nobel Prize in Literature. 1955: resigns after a stroke. 1965: death — state funeral, global event.',ctx:'"Never in the field of human conflict was so much owed by so many to so few" — Battle of Britain speech.',diff:'new'},
{id:96,sub:'s1',deck:'Figures cles GB dates',q:'Elizabeth I (1533-1603) — key dates.',a:'1533: born (daughter of Henry VIII and Anne Boleyn). 1558: becomes queen after "Bloody Mary"\'s reign. 1559 Religious Settlement + Act of Supremacy: re-establishes Church of England. 1587: has Mary Queen of Scots executed. 1588: Spanish Armada destroyed — Britain becomes a major maritime power. 1603: dies without an heir — James VI of Scotland inherits the throne.',ctx:'She killed the mother; the mother\'s son won the throne — the ultimate irony.',diff:'new'},
{id:97,sub:'s1',deck:'Figures cles GB dates',q:'Queen Victoria (1819-1901) — key dates.',a:'1837: becomes queen at 18. 1840: marries Prince Albert. 1851 Great Exhibition: Albert\'s triumph — Britain = "workshop of the world". 1861: Albert dies — Victoria mourns for 40 years, triggering republican sentiment. 1876: proclaimed Empress of India. 1899-1902: Boer War. 1901: dies after 63-year reign (longest until Elizabeth II).',ctx:'Her isolation after Albert\'s death taught the monarchy that public visibility is essential for survival.',diff:'new'},
{id:98,sub:'s1',deck:'Figures cles GB dates',q:'Florence Nightingale (1820-1910) — key dates.',a:'1853: directs a London hospital for women. 1854: goes to Crimea — transforms hospital hygiene, visits wounded nightly with a lamp. 1857: her 1000-page statistical report leads to Royal Commission on Army Health. 1859: publishes Notes on Nursing — first nursing manual. 1860: founds Nightingale Training School at St Thomas\'s Hospital. 1907: first woman to receive the Order of Merit.',ctx:'She was as much a pioneering statistician as a nurse — practically invented modern epidemiology.',diff:'new'},
{id:99,sub:'s1',deck:'Figures cles GB dates',q:'The Suffragettes — key dates (Pankhurst, Davison, 1918, 1928).',a:'1889: Emmeline Pankhurst founds Women\'s Franchise League. 1903: Women\'s Social and Political Union (WSPU) founded — motto "Deeds, not Words". 1913: Emily Davison throws herself under the king\'s horse at Epsom Derby — dies. 2000 suffragettes escort her coffin. January 1918: women over 30 get the vote. 1928 Equal Franchise Act: women over 21 get the vote. Colors: purple, white, green.',ctx:'6 million women worked during WWI — impossible to deny the vote after.',diff:'new'},
{id:100,sub:'s1',deck:'Figures cles GB dates',q:'Margaret Thatcher (1925-2013) — key dates.',a:'1947: chemistry degree from Oxford. 1953: becomes barrister. 1959: elected Conservative MP. 1975: first woman to lead a British political party. 1979: becomes PM — wins 3 consecutive elections (1979, 1983, 1987). 1982: Falklands War. 1984-85: miners\' strike. 1990: poll tax riots — own colleagues force her out. 2013: death — state mourning AND street parties in mining towns.',ctx:'No British politician has divided opinion more since Cromwell.',diff:'new'},

// ── PEINTURE GB — Dates clés (Fiches 56/57) ────────────────
{id:101,sub:'s1',deck:'Peinture GB dates',q:'18th century painters — birth/death dates and key works.',a:'William Hogarth (1697-1764): A Harlot\'s Progress, A Rake\'s Progress. Joshua Reynolds (1723-1792): founded Royal Academy 1768. Thomas Gainsborough (1727-1788): The Blue Boy (reaction to Reynolds\'s claim that blue was too cold). John Constable (1776-1837): The Haywain, paintings en plein air — precursor of Impressionism.',ctx:'Reynolds and Gainsborough: a rivalry of egos produced one of Britain\'s most famous paintings.',diff:'new'},
{id:102,sub:'s1',deck:'Peinture GB dates',q:'Turner, Blake, Fuseli and the Pre-Raphaelites — dates.',a:'J.M.W. Turner (1775-1851): The Fighting Temeraire, Rain Steam and Speed — incomprehensible to contemporaries, now seen as precursor of abstraction. Henry Fuseli (1741-1825): The Nightmare. William Blake (1757-1827): poet-painter-engraver with mystical visions. Pre-Raphaelite Brotherhood founded 1848: Rossetti (1828-1882) and Burne-Jones (1833-1898). Arts and Crafts movement (Morris + Burne-Jones).',ctx:'Turner left all his works to the nation on condition they stay together — now at Tate Britain.',diff:'new'},
{id:103,sub:'s1',deck:'Peinture GB dates',q:'20th century British artists — key dates.',a:'Francis Bacon (1909-1992): tortured figures, crucifixion triptychs. Lucian Freud (1922-2011): grandson of Sigmund, hyper-realist — controversial portrait of Elizabeth II. Bridget Riley (1931-): Op Art, geometric illusions causing vertigo. David Hockney (1937-): Pop Art swimmer pools, A Bigger Splash, A Year in Normandie (2020, 90m painted on iPad). YBAs founded late 1980s: Tracey Emin (My Bed), Damien Hirst (For the Love of God, 2007 — skull with 8601 diamonds).',ctx:'Angel of the North (Gormley, 1998): 20m high, 54m wingspan, near Gateshead.',diff:'new'},

// ── MÉDIAS GB — Dates clés (Fiche 51) ──────────────────────
{id:104,sub:'s1',deck:'Medias GB dates',q:'Key dates in British press history.',a:'1622: Weekly News — first British newspaper. 1644: Milton\'s Areopagitica — first major argument for press freedom. 1785: The Times founded ("The Thunderer"). 1821: The Guardian founded in Manchester (as Manchester Guardian). 1843: News of the World founded. 1888: Financial Times founded (salmon pink paper). 1981: Rupert Murdoch buys The Times.',ctx:'Fleet Street was the hub of British journalism — all papers have since moved to East London.',diff:'new'},
{id:105,sub:'s1',deck:'Medias GB dates',q:'Key dates in BBC and British broadcasting history.',a:'November 14, 1922: BBC (British Broadcasting Company) begins daily broadcasting. 1927: Royal Charter transforms it into the BBC Corporation. 1932: Broadcasting House opens at Portland Place, London. 1936: regular TV begins. 1955: ITV launched (first commercial channel, opposed by Labour). 1982: Channel 4 launched. 1990: BSkyB (Murdoch). 2003: Ofcom created. 2011: News of the World closed (phone-hacking scandal). 2022: BBC licence fee frozen.',ctx:'BBC motto: "Nation Shall Speak Peace Unto Nation". Founder: John Reith (1922).',diff:'new'},

// ── GUN CONTROL — Dates clés (Fiche 59) ───────────────────
{id:106,sub:'s1',deck:'Gun Control dates',q:'UK gun control timeline — key laws and massacres.',a:'1870: first gun licence required in UK. 1920 Firearms Act: first attempt to prevent criminals from using guns. 1968 Firearms Act: still in force today — distinguishes shotguns (light criteria) from firearms (strict criteria). August 19, 1987 Hungerford massacre: 16 dead → 1988 Firearms (Amendment) Act banning semi-automatic rifles. March 13, 1996 Dunblane: 16 children aged 4-5 + teacher → 1997 Firearms Act banning virtually all handguns. 1997-98 buyback: 162,000 weapons + 700 tonnes of ammunition collected.',ctx:'Compare UK (immediate comprehensive legislation) with US (Congress failed to act after Sandy Hook).',diff:'new'},
{id:107,sub:'s2',deck:'Gun Control dates',q:'US gun control timeline — key laws and massacres.',a:'1791: Second Amendment. 1934 + 1986: laws restricting automatic weapons and machine guns. 1990 Crime Control Act: school gun-free zones (1000 feet radius, up to $5000 fine and 5 years prison). 1993 Brady Handgun Violence Prevention Act: mandatory background checks. April 20, 1999 Columbine: 12 students + 1 teacher. December 14, 2012 Sandy Hook: 20 children aged 6-7 + 6 adults. May 24, 2022 Uvalde: 19 children.',ctx:'After Sandy Hook: 1500 bills proposed, 109 passed — but 70 of those 109 RELAXED existing restrictions.',diff:'new'},

// ── BREXIT — Chronologie complète ─────────────────────────
