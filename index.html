<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>My Flashcards</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet"/>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
font-family: ‘DM Sans’, system-ui, sans-serif;
background: #fdf7f0;
color: #2d2320;
min-height: 100vh;
padding: 0 0 80px;
}

/* ── background blobs ── */
body::before, body::after {
content: ‘’;
position: fixed;
border-radius: 50%;
filter: blur(80px);
opacity: .22;
pointer-events: none;
z-index: 0;
}
body::before {
width: 500px; height: 500px;
background: #f5b8cc;
top: -150px; left: -150px;
}
body::after {
width: 400px; height: 400px;
background: #a8d9b5;
bottom: -100px; right: -100px;
}

.wrap {
position: relative;
z-index: 1;
max-width: 680px;
margin: 0 auto;
padding: 32px 18px 0;
}

/* ── header ── */
h1 {
font-family: ‘Playfair Display’, Georgia, serif;
font-size: 2.2rem;
color: #d4607f;
text-align: center;
letter-spacing: -.5px;
}
.sub {
text-align: center;
color: #b09a94;
font-size: .88rem;
margin-top: 5px;
margin-bottom: 26px;
}

/* ── tabs ── */
.tabs {
display: flex;
gap: 5px;
background: #fff;
border-radius: 50px;
padding: 5px;
margin-bottom: 24px;
box-shadow: 0 2px 16px rgba(212,96,127,.10);
}
.tab {
flex: 1;
padding: 11px;
border: none;
background: transparent;
border-radius: 50px;
font-family: ‘DM Sans’, sans-serif;
font-size: .85rem;
cursor: pointer;
color: #b09a94;
transition: all .2s;
font-weight: 500;
}
.tab.on {
background: linear-gradient(135deg, #f5b8cc, #f9cdd9);
color: #2d2320;
font-weight: 600;
box-shadow: 0 2px 10px rgba(212,96,127,.2);
}

/* ── stats ── */
.stats {
display: flex;
gap: 10px;
margin-bottom: 20px;
}
.sp {
flex: 1;
background: #fff;
border-radius: 16px;
padding: 14px 6px;
text-align: center;
box-shadow: 0 2px 12px rgba(0,0,0,.06);
border: 1.5px solid #f5ebe8;
}
.sp .n {
font-family: ‘Playfair Display’, Georgia, serif;
font-size: 1.6rem;
font-weight: 600;
line-height: 1;
}
.sp.pk .n { color: #d4607f; }
.sp.gn .n { color: #4a9962; }
.sp.gr .n { color: #b09a94; }
.sp .l { font-size: .7rem; color: #b09a94; margin-top: 3px; letter-spacing: .03em; }

/* ── study-all button ── */
.btn-main {
display: block;
width: 100%;
padding: 14px;
background: linear-gradient(135deg, #f5b8cc 0%, #a8d9b5 100%);
border: none;
border-radius: 14px;
font-family: ‘DM Sans’, sans-serif;
font-size: .95rem;
font-weight: 600;
cursor: pointer;
margin-bottom: 16px;
color: #2d2320;
box-shadow: 0 3px 14px rgba(212,96,127,.18);
transition: opacity .2s, transform .1s;
}
.btn-main:active { opacity: .88; transform: scale(.99); }

/* ── folder grid ── */
.folder-grid {
display: grid;
grid-template-columns: repeat(2, 1fr);
gap: 12px;
margin-bottom: 16px;
}
.folder-card {
background: #fff;
border-radius: 18px;
padding: 22px 14px 18px;
text-align: center;
cursor: pointer;
border: 1.5px solid #f5ebe8;
box-shadow: 0 2px 12px rgba(0,0,0,.06);
transition: transform .18s, box-shadow .18s;
}
.folder-card:active {
transform: scale(.97);
box-shadow: 0 1px 6px rgba(0,0,0,.08);
}
.fi { font-size: 2rem; margin-bottom: 8px; }
.fn {
font-family: ‘Playfair Display’, Georgia, serif;
font-size: .95rem;
font-weight: 600;
color: #2d2320;
}
.fc2 { font-size: .73rem; color: #b09a94; margin-top: 3px; }
.fp { margin-top: 10px; height: 5px; background: #fce8ef; border-radius: 50px; overflow: hidden; }
.fpf { height: 100%; background: linear-gradient(90deg, #f5b8cc, #a8d9b5); border-radius: 50px; }

.add-folder-card {
background: linear-gradient(135deg, #fce8ef, #ddf0e4);
border: 2px dashed #f5b8cc;
border-radius: 18px;
padding: 22px 14px 18px;
text-align: center;
cursor: pointer;
transition: opacity .18s;
}
.add-folder-card:active { opacity: .8; }
.add-folder-card .fi { color: #d4607f; font-size: 1.5rem; }
.add-folder-card .fn { color: #d4607f; font-size: .9rem; font-family: ‘DM Sans’, sans-serif; font-weight: 600; margin-top: 4px; }

/* ── cards view ── */
.bc {
display: flex;
gap: 6px;
align-items: center;
margin-bottom: 16px;
font-size: .85rem;
color: #b09a94;
flex-wrap: wrap;
}
.bc-home {
background: #fce8ef;
border: none;
cursor: pointer;
color: #d4607f;
font-family: ‘DM Sans’, sans-serif;
font-size: .82rem;
font-weight: 600;
padding: 5px 13px;
border-radius: 50px;
}

.deck-row { display: flex; gap: 7px; flex-wrap: wrap; margin-bottom: 14px; }
.chip {
padding: 6px 14px;
border-radius: 50px;
border: 1.5px solid #f5ebe8;
background: #fff;
font-family: ‘DM Sans’, sans-serif;
font-size: .82rem;
cursor: pointer;
color: #b09a94;
transition: all .18s;
font-weight: 500;
}
.chip.on {
border-color: #d4607f;
color: #d4607f;
background: #fce8ef;
font-weight: 600;
}

/* progress */
.pbar { margin-bottom: 16px; }
.plabel { display: flex; justify-content: space-between; font-size: .75rem; color: #b09a94; margin-bottom: 5px; }
.ptrack { background: #f5ebe8; border-radius: 50px; height: 7px; overflow: hidden; }
.pfill { height: 100%; border-radius: 50px; background: linear-gradient(90deg, #f5b8cc, #a8d9b5); transition: width .35s ease; }

/* ── flashcard ── */
.card-box {
background: #fff;
border-radius: 20px;
padding: 36px 24px;
text-align: center;
min-height: 200px;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
cursor: pointer;
margin-bottom: 14px;
box-shadow: 0 4px 24px rgba(0,0,0,.08);
border: 1.5px solid #f5ebe8;
transition: transform .1s;
}
.card-box:active { transform: scale(.99); }
.card-box.back {
background: linear-gradient(160deg, #ddf0e4, #edf8f1);
border-color: #a8d9b5;
}
.cq {
font-family: ‘Playfair Display’, Georgia, serif;
font-size: 1.2rem;
line-height: 1.5;
margin-bottom: 10px;
color: #2d2320;
font-weight: 600;
}
.chint { font-size: .78rem; color: #b09a94; }
.ca { font-size: .97rem; line-height: 1.7; color: #2d2320; }
.ctx {
display: block;
font-size: .78rem;
color: #7aaa90;
font-style: italic;
margin-top: 10px;
padding-top: 10px;
border-top: 1px solid #a8d9b540;
width: 100%;
text-align: center;
}

/* answer buttons */
.abts { display: grid; grid-template-columns: repeat(3,1fr); gap: 9px; margin-bottom: 13px; }
.ab {
padding: 12px 6px;
border: none;
border-radius: 14px;
font-family: ‘DM Sans’, sans-serif;
font-size: .85rem;
font-weight: 600;
cursor: pointer;
transition: transform .1s, opacity .18s;
}
.ab:active { transform: scale(.96); opacity: .88; }
.ab.hard   { background: #fce8ef; color: #d4607f; }
.ab.medium { background: #fef3cc; color: #b38600; }
.ab.easy   { background: #ddf0e4; color: #3d8a55; }

.nav { display: flex; gap: 9px; justify-content: center; }
.nb {
padding: 9px 20px;
border-radius: 50px;
border: 1.5px solid #f5b8cc;
background: #fff;
cursor: pointer;
font-family: ‘DM Sans’, sans-serif;
font-size: .83rem;
color: #2d2320;
font-weight: 500;
transition: background .18s;
}
.nb:hover { background: #fce8ef; }
.nb.pri {
background: linear-gradient(135deg, #f5b8cc, #a8d9b5);
border-color: transparent;
font-weight: 600;
}

/* ── add / manage ── */
.panel {
background: #fff;
border-radius: 20px;
padding: 24px 20px;
box-shadow: 0 2px 16px rgba(0,0,0,.07);
border: 1.5px solid #f5ebe8;
}
.panel h2 {
font-family: ‘Playfair Display’, Georgia, serif;
font-size: 1.2rem;
color: #d4607f;
margin-bottom: 16px;
font-weight: 600;
}
.fr { margin-bottom: 13px; }
.fr label {
display: block;
font-size: .72rem;
font-weight: 600;
color: #b09a94;
margin-bottom: 5px;
text-transform: uppercase;
letter-spacing: .05em;
}
.fr input, .fr textarea, .fr select {
width: 100%;
padding: 11px 13px;
border: 1.5px solid #f5ebe8;
border-radius: 12px;
font-family: ‘DM Sans’, sans-serif;
font-size: .9rem;
color: #2d2320;
background: #fdf7f0;
resize: vertical;
outline: none;
transition: border-color .18s;
}
.fr input:focus, .fr textarea:focus, .fr select:focus { border-color: #f5b8cc; }
.fr textarea { min-height: 76px; }
.fbtns { display: flex; gap: 9px; margin-top: 16px; }
.bpri {
flex: 1;
padding: 12px;
background: linear-gradient(135deg, #f5b8cc, #a8d9b5);
border: none;
border-radius: 12px;
font-family: ‘DM Sans’, sans-serif;
font-size: .92rem;
font-weight: 600;
cursor: pointer;
transition: opacity .18s;
}
.bpri:active { opacity: .88; }
.bsec {
padding: 12px 18px;
background: #fff;
border: 1.5px solid #f5ebe8;
border-radius: 12px;
font-family: ‘DM Sans’, sans-serif;
font-size: .92rem;
cursor: pointer;
color: #b09a94;
}

/* manage list */
.mlist { display: flex; flex-direction: column; gap: 9px; }
.mi {
background: #fff;
border-radius: 14px;
padding: 12px 14px;
display: flex;
align-items: center;
gap: 10px;
box-shadow: 0 1px 8px rgba(0,0,0,.06);
border: 1.5px solid #f5ebe8;
}
.mq { flex: 1; font-size: .85rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mb { font-size: .68rem; background: #fce8ef; color: #d4607f; padding: 3px 8px; border-radius: 50px; white-space: nowrap; font-weight: 500; }
.ms { font-size: .68rem; background: #ddf0e4; color: #3d8a55; padding: 3px 8px; border-radius: 50px; white-space: nowrap; }
.del { background: none; border: none; cursor: pointer; color: #d4b4bc; font-size: 1rem; flex-shrink: 0; transition: color .18s; }
.del:hover { color: #d4607f; }

/* done / empty */
.empty { text-align: center; padding: 48px 16px; color: #b09a94; font-size: .95rem; }
.done {
text-align: center;
background: #fff;
border-radius: 20px;
padding: 44px 24px;
box-shadow: 0 4px 24px rgba(0,0,0,.08);
}
.done h2 {
font-family: ‘Playfair Display’, Georgia, serif;
font-size: 1.5rem;
color: #3d8a55;
margin-bottom: 8px;
}
.done p { color: #b09a94; margin-bottom: 20px; }

/* ── modal ── */
.overlay {
display: none;
position: fixed;
inset: 0;
background: rgba(45,35,32,.45);
z-index: 100;
align-items: flex-start;
justify-content: center;
padding-top: 100px;
}
.overlay.open { display: flex; }
.modal {
background: #fff;
border-radius: 20px;
padding: 24px;
width: 92%;
max-width: 360px;
box-shadow: 0 8px 40px rgba(0,0,0,.18);
}
.modal h3 {
font-family: ‘Playfair Display’, Georgia, serif;
font-size: 1.15rem;
color: #d4607f;
margin-bottom: 14px;
}

/* ── toast ── */
.toast {
position: fixed;
bottom: 26px;
left: 50%;
transform: translateX(-50%) translateY(90px);
background: #2d2320;
color: #fff;
padding: 9px 22px;
border-radius: 50px;
font-size: .84rem;
transition: transform .3s cubic-bezier(.34,1.56,.64,1);
z-index: 200;
pointer-events: none;
font-family: ‘DM Sans’, sans-serif;
box-shadow: 0 4px 20px rgba(0,0,0,.2);
}
.toast.show { transform: translateX(-50%) translateY(0); }

@media (max-width: 420px) {
h1 { font-size: 1.7rem; }
.abts { grid-template-columns: 1fr; }
.folder-grid { grid-template-columns: repeat(2,1fr); gap: 10px; }
}
</style>

</head>
<body>
<div class="wrap">

<h1>✿ My Flashcards</h1>
<p class="sub">Tous tes cours en un seul endroit</p>

<div class="tabs">
  <button class="tab on" id="t-study">📖 Reviser</button>
  <button class="tab" id="t-add">＋ Ajouter</button>
  <button class="tab" id="t-manage">⊞ Gerer</button>
</div>

<!-- STUDY -->

<div id="panel-study">
  <div class="stats">
    <div class="sp pk"><div class="n" id="stat-total">-</div><div class="l">Total</div></div>
    <div class="sp gn"><div class="n" id="stat-easy">-</div><div class="l">Maitrisees</div></div>
    <div class="sp gr"><div class="n" id="stat-due">-</div><div class="l">A revoir</div></div>
  </div>
  <button class="btn-main" id="btn-study-all">📖 Tout reviser</button>
  <div class="folder-grid" id="folder-grid"></div>
</div>

<!-- ADD -->

<div id="panel-add" style="display:none">
  <div class="panel">
    <h2>Nouvelle carte ✦</h2>
    <div class="fr"><label>Dossier</label><select id="ns"></select></div>
    <div class="fr"><label>Theme / Deck</label><input id="nd" type="text" placeholder="Ex: Brexit, Phonologie..."/></div>
    <div class="fr"><label>Question</label><textarea id="nq" placeholder="Ex: What year was..."></textarea></div>
    <div class="fr"><label>Reponse</label><textarea id="na" placeholder="Ex: 1964 — outlawed..."></textarea></div>
    <div class="fr"><label>Note (optionnel)</label><input id="nc" type="text" placeholder="Ex: Key date for oral prep"/></div>
    <div class="fbtns">
      <button class="bpri" id="btn-save-card">Ajouter ✦</button>
      <button class="bsec" id="btn-cancel-card">Annuler</button>
    </div>
  </div>
</div>

<!-- MANAGE -->

<div id="panel-manage" style="display:none">
  <div id="manage-list"></div>
</div>

<!-- CARDS VIEW -->

<div id="panel-cards" style="display:none">
  <div class="bc">
    <button class="bc-home" id="btn-back-home">🏠 Accueil</button>
    <span id="bc-sub"></span>
  </div>
  <div class="stats">
    <div class="sp pk"><div class="n" id="cstat-total">0</div><div class="l">Cartes</div></div>
    <div class="sp gn"><div class="n" id="cstat-easy">0</div><div class="l">Maitrisees</div></div>
    <div class="sp gr"><div class="n" id="cstat-due">0</div><div class="l">A revoir</div></div>
  </div>
  <div class="deck-row" id="deck-row"></div>
  <div class="pbar">
    <div class="plabel"><span id="prog-txt">0 / 0</span><span id="prog-pct">0%</span></div>
    <div class="ptrack"><div class="pfill" id="prog-fill" style="width:0%"></div></div>
  </div>
  <div id="card-content"></div>
</div>

</div><!-- end .wrap -->

<!-- MODAL -->

<div class="overlay" id="modal">
  <div class="modal">
    <h3>Nouveau dossier ✦</h3>
    <div class="fr"><label>Nom</label><input id="folder-name" type="text" placeholder="Ex: Grammaire, Phonologie..."/></div>
    <div class="fr"><label>Emoji (colle-en un)</label><input id="folder-icon" type="text" placeholder="🎯" maxlength="8"/></div>
    <div class="fbtns">
      <button class="bpri" id="btn-confirm-folder">Creer</button>
      <button class="bsec" id="btn-cancel-folder">Annuler</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var store=(function(){try{localStorage.setItem('_x','1');localStorage.removeItem('_x');return localStorage;}catch(e){var m={};return{getItem:function(k){return m.hasOwnProperty(k)?m[k]:null;},setItem:function(k,v){m[k]=String(v);}};}})();
var SUBJECTS=[{id:'s1',name:'Civilisation',icon:'🌍'},{id:'s2',name:'Litterature',icon:'📚'}];
var CARDS=[
{id:1,sub:'s1',deck:'Brexit',q:'What date was the Brexit referendum?',a:'June 23, 2016. Result: 52% Leave vs 48% Remain.',ctx:'Core date — always know this.',diff:'new'},
{id:2,sub:'s1',deck:'Brexit',q:'When did the UK officially leave the EU?',a:'January 31, 2020. Transition period until Dec 31, 2020.',ctx:'4 years between vote and exit.',diff:'new'},
{id:3,sub:'s1',deck:'Brexit',q:'Who triggered Article 50 and when?',a:'Theresa May, March 2017 — starting the 2-year exit process.',ctx:'Article 50 = official notice to leave.',diff:'new'},
{id:4,sub:'s1',deck:'Brexit',q:'How many times did Parliament reject the Withdrawal Agreement?',a:'Three times — led to May resigning, Johnson taking over in 2019.',ctx:'Shows the scale of the deadlock.',diff:'new'},
{id:5,sub:'s1',deck:'Brexit',q:'What was the Leave campaign key slogan?',a:'Take Back Control — focused on sovereignty, immigration, identity.',ctx:'UKIP under Farage pushed this hard.',diff:'new'},
{id:6,sub:'s1',deck:'Brexit',q:'How did Scotland vote and what did the SNP demand?',a:'62% Remain. SNP demanded a second independence referendum (indyref2).',ctx:'Key devolution tension post-Brexit.',diff:'new'},
{id:7,sub:'s1',deck:'Brexit',q:'Why was Brexit a threat to the Good Friday Agreement?',a:'The 1998 Agreement made the Irish border invisible. Brexit risked reimposing a hard border.',ctx:'Most complex geopolitical dimension.',diff:'new'},
{id:8,sub:'s1',deck:'Brexit',q:'What replaced the Northern Ireland Protocol?',a:'The Windsor Framework (2023) — N. Ireland stays aligned with EU rules, trade border in Irish Sea.',ctx:'Still controversial with Unionists.',diff:'new'},
{id:9,sub:'s1',deck:'Brexit',q:'Name 4 fractures Brexit revealed.',a:'England+Wales (Leave) vs Scotland+N.Ireland (Remain). Urban vs Rural. Young vs Old. Graduates vs Non-graduates.',ctx:'Brexit as identity crisis.',diff:'new'},
{id:10,sub:'s1',deck:'Brexit',q:'Name 5 key Brexit vocabulary words.',a:'sovereignty, trade deal, hard/soft Brexit, devolution, border issue',ctx:'Use these naturally in your oral.',diff:'new'},
{id:11,sub:'s1',deck:'Race in America',q:'What did the 1964 Civil Rights Act do?',a:'Outlawed discrimination based on race, colour, religion, sex. Signed by LBJ after years of activism.',ctx:'MLK was a key figure.',diff:'new'},
{id:12,sub:'s1',deck:'Race in America',q:'What sparked the 2020 BLM protests?',a:'Murder of George Floyd by officer Derek Chauvin, May 25, 2020 in Minneapolis.',ctx:'Global reckoning on systemic racism.',diff:'new'},
{id:13,sub:'s1',deck:'Race in America',q:'What is systemic racism?',a:'Racism in institutions, laws, systems — not just individual prejudice. Seen in policing, housing, healthcare, education.',ctx:'Distinguish from individual racism.',diff:'new'},
{id:14,sub:'s1',deck:'Climate',q:'What is the Paris Agreement?',a:'UN accord signed in 2015, targeting max 1.5-2 degrees of warming above pre-industrial levels.',ctx:'US withdrew under Trump, rejoined under Biden.',diff:'new'},
{id:15,sub:'s1',deck:'Climate',q:'Who started Fridays for Future?',a:'Greta Thunberg, 2018. Her "How dare you" UN speech in 2019 became iconic.',ctx:'Youth vs political inaction.',diff:'new'},
{id:16,sub:'s1',deck:'Media',q:'What is fake news and why is it dangerous?',a:'Deliberately false info spread via media/social networks. Erodes trust in institutions.',ctx:'Trump weaponised the term.',diff:'new'},
{id:17,sub:'s1',deck:'Media',q:'What is the BBC and how is it funded?',a:'UK public broadcaster, funded by licence fee (~169 GBP/year). Independent of government.',ctx:'Model of public service journalism.',diff:'new'},
{id:18,sub:'s2',deck:'The Tempest',q:'Who wrote The Tempest and when?',a:'Shakespeare, around 1610-1611. Generally his last solo play.',ctx:'Often read as his farewell to theatre.',diff:'new'},
{id:19,sub:'s2',deck:'The Tempest',q:'What does Caliban say about language?',a:'"You taught me language, and my profit on it is I know how to curse." Language as control — Caliban turns it into resistance.',ctx:'Core postcolonial reading.',diff:'new'}
];
var subjects,cards,activeSub,activeDeck,queue,qIdx,revealed,sessionDone;
function loadData(){var ss=store.getItem('fcs4'),sc=store.getItem('fcc4');subjects=ss?tryParse(ss,cloneArr(SUBJECTS)):cloneArr(SUBJECTS);cards=sc?tryParse(sc,cloneArr(CARDS)):cloneArr(CARDS);}
function tryParse(s,fb){try{var v=JSON.parse(s);return(v&&typeof v==='object'&&v.length!==undefined)?v:fb;}catch(e){return fb;}}
function cloneArr(a){var o=[];for(var i=0;i<a.length;i++){var n={},s=a[i];for(var k in s)n[k]=s[k];o.push(n);}return o;}
function persist(){try{store.setItem('fcs4',JSON.stringify(subjects));}catch(e){}try{store.setItem('fcc4',JSON.stringify(cards));}catch(e){}}
function findSub(id){for(var i=0;i<subjects.length;i++)if(subjects[i].id===id)return subjects[i];return null;}
function countEasy(a){var n=0;for(var i=0;i<a.length;i++)if(a[i].diff==='easy')n++;return n;}
function showPanel(name){var ps=['study','add','manage','cards'];for(var i=0;i<ps.length;i++){var el=document.getElementById('panel-'+ps[i]);if(el)el.style.display=ps[i]===name?'block':'none';}var ts=['study','add','manage'];for(var j=0;j<ts.length;j++){var t=document.getElementById('t-'+ts[j]);if(t)t.className='tab'+(ts[j]===name||(name==='cards'&&ts[j]==='study')?' on':'');}}
function renderHome(){showPanel('study');var easy=countEasy(cards);document.getElementById('stat-total').textContent=cards.length;document.getElementById('stat-easy').textContent=easy;document.getElementById('stat-due').textContent=cards.length-easy;var grid=document.getElementById('folder-grid'),html='';for(var i=0;i<subjects.length;i++){var s=subjects[i],sc=0,se=0;for(var j=0;j<cards.length;j++){if(cards[j].sub===s.id){sc++;if(cards[j].diff==='easy')se++;}}var pct=sc?Math.round(se/sc*100):0;html+='<div class="folder-card" data-sid="'+s.id+'"><div class="fi">'+s.icon+'</div><div class="fn">'+s.name+'</div><div class="fc2">'+sc+' cartes</div><div class="fp"><div class="fpf" style="width:'+pct+'%"></div></div></div>';}html+='<div class="add-folder-card" id="btn-new-folder"><div class="fi">+</div><div class="fn">Nouveau dossier</div></div>';grid.innerHTML=html;var fcs=grid.getElementsByClassName('folder-card');for(var k=0;k<fcs.length;k++){fcs[k].onclick=(function(sid){return function(){goToSubject(sid);};})(fcs[k].getAttribute('data-sid'));}document.getElementById('btn-new-folder').onclick=function(){document.getElementById('modal').className='overlay open';};}
function buildQueue(){var pool=[];for(var i=0;i<cards.length;i++){var c=cards[i];if(activeSub&&c.sub!==activeSub)continue;if(activeDeck!=='Tous'&&c.deck!==activeDeck)continue;pool.push(c);}pool.sort(function(a,b){var o={hard:0,medium:1,new:2,easy:3};return(o[a.diff]!==undefined?o[a.diff]:2)-(o[b.diff]!==undefined?o[b.diff]:2);});queue=pool;qIdx=0;revealed=false;sessionDone=0;}
function goToSubject(sid){activeSub=sid;activeDeck='Tous';buildQueue();renderCards();}
function goToAll(){activeSub=null;activeDeck='Tous';buildQueue();renderCards();}
function renderCards(){showPanel('cards');var subj=activeSub?findSub(activeSub):null;document.getElementById('bc-sub').textContent=subj?(' › '+subj.icon+' '+subj.name):' › Tout';var pool=[];for(var i=0;i<cards.length;i++)if(!activeSub||cards[i].sub===activeSub)pool.push(cards[i]);var easy=countEasy(pool);document.getElementById('cstat-total').textContent=pool.length;document.getElementById('cstat-easy').textContent=easy;document.getElementById('cstat-due').textContent=pool.length-easy;var decks=['Tous'];for(var d=0;d<pool.length;d++){var found=false;for(var di=0;di<decks.length;di++){if(decks[di]===pool[d].deck){found=true;break;}}if(!found)decks.push(pool[d].deck);}var dr=document.getElementById('deck-row'),dhtml='';for(var dk=0;dk<decks.length;dk++){dhtml+='<button class="chip'+(decks[dk]===activeDeck?' on':'')+'" data-deck="'+decks[dk]+'">'+decks[dk]+'</button>';}dr.innerHTML=dhtml;var chips=dr.getElementsByTagName('button');for(var ci=0;ci<chips.length;ci++){chips[ci].onclick=(function(dn){return function(){activeDeck=dn;buildQueue();renderCards();};})(chips[ci].getAttribute('data-deck'));}var pct=queue.length?Math.round(sessionDone/queue.length*100):0;document.getElementById('prog-txt').textContent=sessionDone+' / '+queue.length;document.getElementById('prog-pct').textContent=pct+'%';document.getElementById('prog-fill').style.width=pct+'%';var cc=document.getElementById('card-content');if(!queue.length){cc.innerHTML='<div class="empty">Aucune carte ici. Ajoute-en depuis + !</div>';}else if(qIdx>=queue.length){cc.innerHTML='<div class="done"><h2>Session terminee !</h2><p>Tu as revu '+sessionDone+' cartes — bravo !</p><button class="nb pri" id="btn-restart">Recommencer</button></div>';document.getElementById('btn-restart').onclick=function(){buildQueue();renderCards();};}else{var c=queue[qIdx];if(!revealed){cc.innerHTML='<div class="card-box" id="card-box"><p class="cq">'+c.q+'</p><p class="chint">Appuie pour voir la reponse ✦</p></div><div class="nav"><button class="nb" id="btn-prev">← Precedent</button><button class="nb" id="btn-skip">Passer →</button></div>';document.getElementById('card-box').onclick=function(){revealed=true;renderCards();};}else{cc.innerHTML='<div class="card-box back">'+c.a+(c.ctx?'<span class="ctx">💡 '+c.ctx+'</span>':'')+'</div><div class="abts"><button class="ab hard" id="btn-hard">😬 Difficile</button><button class="ab medium" id="btn-med">🤔 Moyen</button><button class="ab easy" id="btn-easy">✅ Maitrise !</button></div><div class="nav"><button class="nb" id="btn-prev">← Precedent</button><button class="nb" id="btn-skip">Passer →</button></div>';document.getElementById('btn-hard').onclick=function(){rate('hard');};document.getElementById('btn-med').onclick=function(){rate('medium');};document.getElementById('btn-easy').onclick=function(){rate('easy');};}document.getElementById('btn-prev').onclick=function(){if(qIdx>0){qIdx--;revealed=false;renderCards();}};document.getElementById('btn-skip').onclick=function(){qIdx++;revealed=false;renderCards();};}}
function rate(diff){for(var i=0;i<cards.length;i++){if(cards[i].id===queue[qIdx].id){cards[i].diff=diff;break;}}persist();sessionDone++;qIdx++;revealed=false;renderCards();}
function renderAdd(){showPanel('add');var sel=document.getElementById('ns');sel.innerHTML='';for(var i=0;i<subjects.length;i++){var opt=document.createElement('option');opt.value=subjects[i].id;opt.textContent=subjects[i].icon+' '+subjects[i].name;sel.appendChild(opt);}}
function renderManage(){showPanel('manage');var el=document.getElementById('manage-list');if(!cards.length){el.innerHTML='<div class="empty">Aucune carte.</div>';return;}var html='<div class="mlist">';for(var i=0;i<cards.length;i++){var c=cards[i],s=findSub(c.sub);html+='<div class="mi"><div class="mq">'+c.q+'</div>'+(s?'<span class="ms">'+s.icon+'</span>':'')+'<span class="mb">'+c.deck+'</span><button class="del" data-cid="'+c.id+'">✕</button></div>';}html+='</div>';el.innerHTML=html;var dels=el.getElementsByClassName('del');for(var d=0;d<dels.length;d++){dels[d].onclick=(function(cid){return function(){var nc=[];for(var i=0;i<cards.length;i++)if(cards[i].id!==cid)nc.push(cards[i]);cards=nc;persist();buildQueue();renderManage();toast('Supprimee !');};})( parseInt(dels[d].getAttribute('data-cid'),10));}}
function toast(msg){var el=document.getElementById('toast');el.textContent=msg;el.className='toast show';setTimeout(function(){el.className='toast';},2200);}
loadData();
activeSub=null;activeDeck='Tous';queue=[];qIdx=0;revealed=false;sessionDone=0;
document.getElementById('t-study').onclick=function(){renderHome();};
document.getElementById('t-add').onclick=function(){renderAdd();};
document.getElementById('t-manage').onclick=function(){renderManage();};
document.getElementById('btn-study-all').onclick=function(){goToAll();};
document.getElementById('btn-back-home').onclick=function(){renderHome();};
document.getElementById('btn-save-card').onclick=function(){var sub=document.getElementById('ns').value,deck=document.getElementById('nd').value.trim(),q=document.getElementById('nq').value.trim(),a=document.getElementById('na').value.trim(),ctx=document.getElementById('nc').value.trim();if(!q||!a||!deck){toast('Remplis tous les champs !');return;}cards.push({id:Date.now(),sub:sub,deck:deck,q:q,a:a,ctx:ctx,diff:'new'});persist();document.getElementById('nd').value='';document.getElementById('nq').value='';document.getElementById('na').value='';document.getElementById('nc').value='';toast('Carte ajoutee !');renderHome();};
document.getElementById('btn-cancel-card').onclick=function(){renderHome();};
document.getElementById('btn-confirm-folder').onclick=function(){var name=document.getElementById('folder-name').value.trim(),icon=document.getElementById('folder-icon').value.trim()||'📁';if(!name){toast('Donne un nom !');return;}subjects.push({id:'s'+Date.now(),name:name,icon:icon});persist();document.getElementById('modal').className='overlay';document.getElementById('folder-name').value='';document.getElementById('folder-icon').value='';renderHome();toast('Dossier cree !');};
document.getElementById('btn-cancel-folder').onclick=function(){document.getElementById('modal').className='overlay';};
renderHome();
</script>
