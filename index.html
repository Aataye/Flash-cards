<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>My Flashcards</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: sans-serif; background: #fdf7f0; color: #2d2320; min-height: 100vh; padding: 20px; }
#error-box { display: none; background: #fee; border: 2px solid red; padding: 12px; border-radius: 8px; margin: 12px 0; font-size: 13px; word-break: break-all; }
h1 { font-size: 1.8rem; color: #d4607f; text-align: center; margin-bottom: 6px; }
.sub { text-align: center; color: #9a8a85; font-size: .88rem; margin-bottom: 20px; }
.tabs { display: flex; gap: 6px; background: #fff; border-radius: 50px; padding: 5px; margin-bottom: 20px; }
.tab { flex: 1; padding: 10px; border: none; background: transparent; border-radius: 50px; font-size: .85rem; cursor: pointer; color: #9a8a85; }
.tab.on { background: #f5b8cc; color: #2d2320; font-weight: bold; }
#panel-study, #panel-add, #panel-manage { min-height: 100px; }
.stats { display: flex; gap: 10px; margin-bottom: 16px; }
.sp { flex: 1; background: #fff; border-radius: 12px; padding: 12px 6px; text-align: center; }
.sp .n { font-size: 1.5rem; font-weight: bold; }
.sp.pk .n { color: #d4607f; } .sp.gn .n { color: #4a9962; } .sp.gr .n { color: #9a8a85; }
.sp .l { font-size: .7rem; color: #9a8a85; }
.folder-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 16px; }
.folder-card { background: #fff; border-radius: 16px; padding: 20px 14px; text-align: center; cursor: pointer; border: 2px solid #fce8ef; }
.folder-card .fi { font-size: 2rem; margin-bottom: 6px; }
.folder-card .fn { font-size: 1rem; font-weight: bold; }
.folder-card .fc2 { font-size: .75rem; color: #9a8a85; margin-top: 3px; }
.folder-card .fp { margin-top: 8px; height: 5px; background: #fce8ef; border-radius: 50px; }
.folder-card .fpf { height: 100%; background: #f5b8cc; border-radius: 50px; }
.btn-main { display: block; width: 100%; padding: 13px; background: #f5b8cc; border: none; border-radius: 12px; font-size: .95rem; font-weight: bold; cursor: pointer; margin-bottom: 14px; }
.add-folder-btn { background: #fce8ef; border: 2px dashed #f5b8cc; border-radius: 16px; padding: 20px 14px; text-align: center; cursor: pointer; color: #d4607f; font-weight: bold; }
.bc { display: flex; gap: 8px; align-items: center; margin-bottom: 14px; font-size: .85rem; color: #9a8a85; flex-wrap: wrap; }
.bc button { background: none; border: none; cursor: pointer; color: #d4607f; font-size: .85rem; font-weight: bold; }
.deck-row { display: flex; gap: 7px; flex-wrap: wrap; margin-bottom: 14px; }
.chip { padding: 5px 13px; border-radius: 50px; border: 2px solid #fce8ef; background: #fff; font-size: .82rem; cursor: pointer; color: #9a8a85; }
.chip.on { border-color: #d4607f; color: #d4607f; background: #fce8ef; font-weight: bold; }
.pbar { margin-bottom: 14px; }
.plabel { display: flex; justify-content: space-between; font-size: .75rem; color: #9a8a85; margin-bottom: 4px; }
.ptrack { background: #fff; border-radius: 50px; height: 7px; }
.pfill { height: 100%; border-radius: 50px; background: #f5b8cc; transition: width .3s; }
.card-wrap { background: #fff; border-radius: 16px; padding: 30px 22px; text-align: center; min-height: 200px; cursor: pointer; margin-bottom: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.card-wrap.revealed { background: #ddf0e4; }
.card-q { font-size: 1.2rem; line-height: 1.5; margin-bottom: 10px; }
.card-hint { font-size: .8rem; color: #9a8a85; }
.card-a { font-size: 1rem; line-height: 1.6; }
.card-ctx { font-size: .78rem; color: #9a8a85; font-style: italic; margin-top: 8px; }
.abts { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; margin-bottom: 12px; }
.ab { padding: 10px; border: none; border-radius: 12px; font-size: .85rem; font-weight: bold; cursor: pointer; }
.ab.hard { background: #fce8ef; color: #d4607f; }
.ab.medium { background: #fde8a0; color: #b38600; }
.ab.easy { background: #ddf0e4; color: #4a9962; }
.nav { display: flex; gap: 8px; justify-content: center; margin-bottom: 10px; }
.nb { padding: 8px 18px; border-radius: 50px; border: 2px solid #f5b8cc; background: #fff; cursor: pointer; font-size: .83rem; }
.nb.pri { background: #f5b8cc; }
.form-box { background: #fff; border-radius: 16px; padding: 22px; }
.form-box h2 { font-size: 1.2rem; color: #d4607f; margin-bottom: 14px; }
.fr { margin-bottom: 12px; }
.fr label { display: block; font-size: .75rem; font-weight: bold; color: #9a8a85; margin-bottom: 4px; text-transform: uppercase; }
.fr input, .fr textarea, .fr select { width: 100%; padding: 10px 12px; border: 2px solid #fce8ef; border-radius: 10px; font-size: .9rem; color: #2d2320; background: #fdf7f0; resize: vertical; }
.fr textarea { min-height: 75px; }
.fbtns { display: flex; gap: 8px; margin-top: 16px; }
.bpri { flex: 1; padding: 11px; background: #f5b8cc; border: none; border-radius: 10px; font-size: .9rem; font-weight: bold; cursor: pointer; }
.bsec { padding: 11px 16px; background: #fff; border: 2px solid #fce8ef; border-radius: 10px; font-size: .9rem; cursor: pointer; color: #9a8a85; }
.mlist { display: flex; flex-direction: column; gap: 8px; }
.mi { background: #fff; border-radius: 12px; padding: 11px 13px; display: flex; align-items: center; gap: 10px; }
.mq { flex: 1; font-size: .85rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mb { font-size: .68rem; background: #fce8ef; color: #d4607f; padding: 2px 7px; border-radius: 50px; }
.ms { font-size: .68rem; background: #ddf0e4; color: #4a9962; padding: 2px 7px; border-radius: 50px; }
.del { background: none; border: none; cursor: pointer; color: #9a8a85; font-size: .95rem; }
.done-box { background: #fff; border-radius: 16px; padding: 40px 22px; text-align: center; }
.done-box h2 { font-size: 1.5rem; color: #4a9962; margin-bottom: 8px; }
.done-box p { color: #9a8a85; margin-bottom: 18px; }
.empty-box { text-align: center; padding: 40px 16px; color: #9a8a85; }
.modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 100; }
.modal-bg.show { display: flex; align-items: center; justify-content: center; }
.modal { background: #fff; border-radius: 16px; padding: 24px; width: 90%; max-width: 380px; }
.modal h3 { font-size: 1.1rem; color: #d4607f; margin-bottom: 14px; }
.toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%) translateY(80px); background: #2d2320; color: #fff; padding: 8px 18px; border-radius: 50px; font-size: .84rem; transition: transform .3s; z-index: 999; }
.toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<h1>My Flashcards</h1>
<p class="sub">Tous tes cours en un seul endroit</p>

<div id="error-box"></div>

<div class="tabs">
  <button class="tab on" id="t-study">Reviser</button>
  <button class="tab" id="t-add">+ Ajouter</button>
  <button class="tab" id="t-manage">Gerer</button>
</div>

<div id="panel-study"></div>
<div id="panel-add" style="display:none"></div>
<div id="panel-manage" style="display:none"></div>

<div class="modal-bg" id="modal-bg">
  <div class="modal">
    <h3>Nouveau dossier</h3>
    <div class="fr"><label>Nom</label><input id="fn" type="text" placeholder="Ex: Grammaire"/></div>
    <div class="fr"><label>Emoji (colle un emoji ici)</label><input id="fi" type="text" placeholder="🎯" maxlength="8"/></div>
    <div class="fbtns">
      <button class="bpri" id="btn-ok-folder">Creer</button>
      <button class="bsec" id="btn-ko-folder">Annuler</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
function showErr(e) {
  var b = document.getElementById('error-box');
  b.style.display = 'block';
  b.textContent = 'ERREUR: ' + (e && e.message ? e.message : String(e));
}

try {

// ── storage ──
var store = (function() {
  try { localStorage.setItem('_x','1'); localStorage.removeItem('_x'); return localStorage; }
  catch(e) { var m = {}; return { getItem: function(k) { return m[k] !== undefined ? m[k] : null; }, setItem: function(k,v) { m[k] = ''+v; } }; }
})();

// ── data ──
var SUBJECTS = [
  { id: 's1', name: 'Civilisation', icon: '🌍' },
  { id: 's2', name: 'Litterature',  icon: '📚' }
];

var CARDS = [
  { id: 1,  sub: 's1', deck: 'Brexit', q: 'What date did the Brexit referendum take place?', a: 'June 23, 2016. Result: 52% Leave vs 48% Remain.', ctx: 'Core date — always know this.', diff: 'new' },
  { id: 2,  sub: 's1', deck: 'Brexit', q: 'When did the UK officially leave the EU?', a: 'January 31, 2020. Transition period until December 31, 2020.', ctx: 'Referendum to Exit: 4 years of chaos.', diff: 'new' },
  { id: 3,  sub: 's1', deck: 'Brexit', q: 'Who triggered Article 50 and when?', a: 'Theresa May in March 2017, starting the 2-year exit process.', ctx: 'Article 50 = official notice to leave the EU.', diff: 'new' },
  { id: 4,  sub: 's1', deck: 'Brexit', q: 'How many times did Parliament reject the Withdrawal Agreement?', a: 'Three times — leading to May resigning and Boris Johnson taking over.', ctx: 'Shows the scale of the deadlock.', diff: 'new' },
  { id: 5,  sub: 's1', deck: 'Brexit', q: 'What was the Leave campaign key slogan?', a: 'Take Back Control — focused on sovereignty, immigration, and identity.', ctx: 'UKIP under Nigel Farage turbocharged this.', diff: 'new' },
  { id: 6,  sub: 's1', deck: 'Brexit', q: 'How did Scotland vote and what did the SNP demand after?', a: 'Scotland voted 62% Remain. SNP demanded a second independence referendum.', ctx: 'Key devolution tension post-Brexit.', diff: 'new' },
  { id: 7,  sub: 's1', deck: 'Brexit', q: 'What is the Good Friday Agreement (1998)?', a: 'It ended conflict in N. Ireland by making the Irish border invisible. Brexit threatened to reimpose a hard border.', ctx: 'Most complex geopolitical dimension of Brexit.', diff: 'new' },
  { id: 8,  sub: 's1', deck: 'Brexit', q: 'What replaced the Northern Ireland Protocol?', a: 'The Windsor Framework (2023) — keeps N. Ireland aligned with EU rules, trade border in Irish Sea.', ctx: 'Still controversial with Unionists.', diff: 'new' },
  { id: 9,  sub: 's1', deck: 'Brexit', q: 'Name 4 fractures Brexit revealed in British society.', a: 'England+Wales (Leave) vs Scotland+N.Ireland (Remain). Urban vs Rural. Young vs Old. Graduates vs Non-graduates.', ctx: 'Brexit as identity crisis.', diff: 'new' },
  { id: 10, sub: 's1', deck: 'Brexit', q: 'Name 5 key Brexit vocabulary words.', a: 'sovereignty, trade deal, hard/soft Brexit, devolution, border issue', ctx: 'Use these naturally in your oral.', diff: 'new' },
  { id: 11, sub: 's1', deck: 'Race in America', q: 'What year was the Civil Rights Act and what did it do?', a: '1964 — outlawed discrimination based on race, colour, religion, sex. Signed by LBJ.', ctx: 'After years of activism by Martin Luther King Jr.', diff: 'new' },
  { id: 12, sub: 's1', deck: 'Race in America', q: 'What sparked the 2020 Black Lives Matter protests?', a: 'The murder of George Floyd by Minneapolis police officer Derek Chauvin on May 25, 2020.', ctx: 'Global reckoning on systemic racism.', diff: 'new' },
  { id: 13, sub: 's1', deck: 'Race in America', q: 'What does systemic racism mean?', a: 'Racism in institutions, laws, social systems — not just individual prejudice. Seen in policing, housing, healthcare, education.', ctx: 'Distinguish from individual racism.', diff: 'new' },
  { id: 14, sub: 's1', deck: 'Climate Crisis', q: 'What is the Paris Agreement?', a: 'A UN accord signed in 2015, targeting max 1.5 to 2 degrees of global warming above pre-industrial levels.', ctx: 'US withdrew under Trump (2020), rejoined under Biden (2021).', diff: 'new' },
  { id: 15, sub: 's1', deck: 'Climate Crisis', q: 'Who started Fridays for Future?', a: 'Greta Thunberg in 2018. Her "How dare you" UN speech in 2019 became iconic.', ctx: 'Youth vs political inaction narrative.', diff: 'new' },
  { id: 16, sub: 's1', deck: 'Media', q: 'What is fake news and how does it threaten democracy?', a: 'False info spread via media/social networks. Erodes trust in institutions and distorts public debate.', ctx: 'Trump weaponised the term against mainstream media.', diff: 'new' },
  { id: 17, sub: 's1', deck: 'Media', q: 'What is the BBC and how is it funded?', a: 'UK public broadcaster. Funded by licence fee (~169 GBP/year). Independent of government.', ctx: 'Model of public service journalism.', diff: 'new' },
  { id: 18, sub: 's2', deck: 'The Tempest', q: 'Who wrote The Tempest and when?', a: 'William Shakespeare, around 1610-1611. Generally his last solo play.', ctx: 'Often read as his farewell to theatre.', diff: 'new' },
  { id: 19, sub: 's2', deck: 'The Tempest', q: 'What does Caliban reveal about language and colonialism?', a: '"You taught me language, and my profit on it is I know how to curse." Language as control — Caliban turns it into resistance.', ctx: 'Core postcolonial reading.', diff: 'new' }
];

// ── state ──
var subjects, cards, activeSub, activeDeck, view, queue, qIdx, revealed, sessionDone;

function initState() {
  try {
    var ss = store.getItem('fcs3');
    subjects = ss ? JSON.parse(ss) : deepCopy(SUBJECTS);
  } catch(e) { subjects = deepCopy(SUBJECTS); }
  try {
    var sc = store.getItem('fcc3');
    cards = sc ? JSON.parse(sc) : deepCopy(CARDS);
  } catch(e) { cards = deepCopy(CARDS); }
  activeSub = null; activeDeck = 'Tous'; view = 'home';
  queue = []; qIdx = 0; revealed = false; sessionDone = 0;
}

function deepCopy(arr) {
  var out = [];
  for (var i = 0; i < arr.length; i++) {
    var o = {}, src = arr[i];
    for (var k in src) { if (Object.prototype.hasOwnProperty.call(src, k)) o[k] = src[k]; }
    out.push(o);
  }
  return out;
}

function save() {
  try { store.setItem('fcs3', JSON.stringify(subjects)); } catch(e) {}
  try { store.setItem('fcc3', JSON.stringify(cards)); } catch(e) {}
}

function findSub(id) {
  for (var i = 0; i < subjects.length; i++) if (subjects[i].id === id) return subjects[i];
  return null;
}

function buildQueue() {
  var pool = [];
  for (var i = 0; i < cards.length; i++) {
    var c = cards[i];
    if (activeSub && c.sub !== activeSub) continue;
    if (activeDeck !== 'Tous' && c.deck !== activeDeck) continue;
    pool.push(c);
  }
  pool.sort(function(a, b) {
    var o = { hard: 0, medium: 1, new: 2, easy: 3 };
    return (o[a.diff] !== undefined ? o[a.diff] : 2) - (o[b.diff] !== undefined ? o[b.diff] : 2);
  });
  queue = pool; qIdx = 0; revealed = false; sessionDone = 0;
}

// ── tabs ──
function showTab(t) {
  var tabs = ['study', 'add', 'manage'];
  for (var i = 0; i < tabs.length; i++) {
    document.getElementById('panel-' + tabs[i]).style.display = tabs[i] === t ? 'block' : 'none';
    document.getElementById('t-' + tabs[i]).className = 'tab' + (tabs[i] === t ? ' on' : '');
  }
}

// ── HOME ──
function renderHome() {
  showTab('study');
  var el = document.getElementById('panel-study');

  var total = cards.length, easy = 0;
  for (var i = 0; i < cards.length; i++) if (cards[i].diff === 'easy') easy++;

  var html = '<div class="stats">'
    + '<div class="sp pk"><div class="n">' + total + '</div><div class="l">Total</div></div>'
    + '<div class="sp gn"><div class="n">' + easy + '</div><div class="l">Maitrisees</div></div>'
    + '<div class="sp gr"><div class="n">' + (total - easy) + '</div><div class="l">A revoir</div></div>'
    + '</div>'
    + '<button class="btn-main" id="b-studyall">Tout reviser</button>'
    + '<div class="folder-grid">';

  for (var j = 0; j < subjects.length; j++) {
    var s = subjects[j], sc = 0, se = 0;
    for (var k = 0; k < cards.length; k++) {
      if (cards[k].sub === s.id) { sc++; if (cards[k].diff === 'easy') se++; }
    }
    var pct = sc ? Math.round(se / sc * 100) : 0;
    html += '<div class="folder-card" id="fc-' + s.id + '">'
      + '<div class="fi">' + s.icon + '</div>'
      + '<div class="fn">' + s.name + '</div>'
      + '<div class="fc2">' + sc + ' cartes</div>'
      + '<div class="fp"><div class="fpf" style="width:' + pct + '%"></div></div>'
      + '</div>';
  }

  html += '<div class="add-folder-btn" id="b-addfolder">➕ Nouveau dossier</div>'
    + '</div>';

  el.innerHTML = html;

  // events
  document.getElementById('b-studyall').onclick = function() {
    activeSub = null; activeDeck = 'Tous'; buildQueue(); renderCards();
  };
  document.getElementById('b-addfolder').onclick = function() {
    document.getElementById('modal-bg').className = 'modal-bg show';
  };
  for (var m = 0; m < subjects.length; m++) {
    (function(sid) {
      var el2 = document.getElementById('fc-' + sid);
      if (el2) el2.onclick = function() {
        activeSub = sid; activeDeck = 'Tous'; buildQueue(); renderCards();
      };
    })(subjects[m].id);
  }
}

// ── CARDS ──
function renderCards() {
  showTab('study');
  var el = document.getElementById('panel-study');
  var subj = activeSub ? findSub(activeSub) : null;

  var bcHtml = '<div class="bc"><button id="b-home">Accueil</button>';
  if (subj) bcHtml += '<span>› ' + subj.icon + ' ' + subj.name + '</span>';
  bcHtml += '</div>';

  var subCards = activeSub ? [] : cards.slice();
  if (activeSub) {
    for (var i = 0; i < cards.length; i++) if (cards[i].sub === activeSub) subCards.push(cards[i]);
  }
  var easy2 = 0;
  for (var j = 0; j < subCards.length; j++) if (subCards[j].diff === 'easy') easy2++;

  var statsH = '<div class="stats">'
    + '<div class="sp pk"><div class="n">' + subCards.length + '</div><div class="l">Cartes</div></div>'
    + '<div class="sp gn"><div class="n">' + easy2 + '</div><div class="l">Maitrisees</div></div>'
    + '<div class="sp gr"><div class="n">' + (subCards.length - easy2) + '</div><div class="l">A revoir</div></div>'
    + '</div>';

  var decks = ['Tous'];
  for (var d = 0; d < subCards.length; d++) {
    var found = false;
    for (var di = 0; di < decks.length; di++) if (decks[di] === subCards[d].deck) { found = true; break; }
    if (!found) decks.push(subCards[d].deck);
  }
  var deckHtml = '<div class="deck-row" id="deck-row">';
  for (var dk = 0; dk < decks.length; dk++) {
    deckHtml += '<button class="chip' + (decks[dk] === activeDeck ? ' on' : '') + '" data-d="' + dk + '">' + decks[dk] + '</button>';
  }
  deckHtml += '</div>';
  var deckNames = decks; // keep ref

  var pct = queue.length ? Math.round(sessionDone / queue.length * 100) : 0;
  var progH = '<div class="pbar"><div class="plabel"><span>' + sessionDone + ' / ' + queue.length + '</span><span>' + pct + '%</span></div>'
    + '<div class="ptrack"><div class="pfill" style="width:' + pct + '%"></div></div></div>';

  var bodyH = '';
  if (!queue.length) {
    bodyH = '<div class="empty-box"><p>Aucune carte ici. Ajoute-en depuis + !</p></div>';
  } else if (qIdx >= queue.length) {
    bodyH = '<div class="done-box"><h2>Session terminee !</h2><p>Tu as revu ' + sessionDone + ' cartes</p><button class="nb pri" id="b-restart">Recommencer</button></div>';
  } else {
    var c = queue[qIdx];
    bodyH = '<div class="card-wrap' + (revealed ? ' revealed' : '') + '" id="card-wrap">'
      + (revealed
        ? '<p class="card-a">' + c.a + '</p>' + (c.ctx ? '<p class="card-ctx">💡 ' + c.ctx + '</p>' : '')
        : '<p class="card-q">' + c.q + '</p><p class="card-hint">Appuie pour voir la reponse</p>')
      + '</div>';
    if (revealed) {
      bodyH += '<div class="abts">'
        + '<button class="ab hard" id="b-hard">Difficile</button>'
        + '<button class="ab medium" id="b-med">Moyen</button>'
        + '<button class="ab easy" id="b-easy">Maitrise !</button>'
        + '</div>';
    }
    bodyH += '<div class="nav">'
      + '<button class="nb" id="b-prev">Precedent</button>'
      + '<button class="nb" id="b-skip">Passer</button>'
      + '</div>';
  }

  el.innerHTML = bcHtml + statsH + deckHtml + progH + bodyH;

  // events
  var homeBtn = document.getElementById('b-home');
  if (homeBtn) homeBtn.onclick = function() { view = 'home'; activeSub = null; activeDeck = 'Tous'; renderHome(); };

  var chipBtns = document.getElementById('deck-row') ? document.getElementById('deck-row').getElementsByClassName('chip') : [];
  for (var ci = 0; ci < chipBtns.length; ci++) {
    (function(btn, idx) {
      btn.onclick = function() { activeDeck = deckNames[idx]; buildQueue(); renderCards(); };
    })(chipBtns[ci], parseInt(chipBtns[ci].getAttribute('data-d'), 10));
  }

  var restart = document.getElementById('b-restart');
  if (restart) restart.onclick = function() { buildQueue(); renderCards(); };

  var cardWrap = document.getElementById('card-wrap');
  if (cardWrap) cardWrap.onclick = function() { revealed = true; renderCards(); };

  function rateCard(diff) {
    for (var i = 0; i < cards.length; i++) {
      if (cards[i].id === queue[qIdx].id) { cards[i].diff = diff; break; }
    }
    save(); sessionDone++; qIdx++; revealed = false; renderCards();
  }
  var bh = document.getElementById('b-hard');   if (bh) bh.onclick = function(e) { e.stopPropagation(); rateCard('hard'); };
  var bm = document.getElementById('b-med');    if (bm) bm.onclick = function(e) { e.stopPropagation(); rateCard('medium'); };
  var be = document.getElementById('b-easy');   if (be) be.onclick = function(e) { e.stopPropagation(); rateCard('easy'); };
  var bp = document.getElementById('b-prev');   if (bp) bp.onclick = function() { if (qIdx > 0) { qIdx--; revealed = false; renderCards(); } };
  var bs = document.getElementById('b-skip');   if (bs) bs.onclick = function() { qIdx++; revealed = false; renderCards(); };
}

// ── ADD ──
function renderAdd() {
  var opts = '';
  for (var i = 0; i < subjects.length; i++) opts += '<option value="' + subjects[i].id + '">' + subjects[i].icon + ' ' + subjects[i].name + '</option>';
  document.getElementById('panel-add').innerHTML = '<div class="form-box">'
    + '<h2>Nouvelle carte</h2>'
    + '<div class="fr"><label>Dossier</label><select id="ns">' + opts + '</select></div>'
    + '<div class="fr"><label>Theme</label><input id="nd" type="text" placeholder="Ex: Brexit"/></div>'

document.getElementById(‘b-savecard’).onclick = function() {
var sub = document.getElementById(‘ns’).value;
var deck = document.getElementById(‘nd’).value.trim();
var q = document.getElementById(‘nq’).value.trim();
var a = document.getElementById(‘na’).value.trim();
var ctx = document.getElementById(‘nc’).value.trim();
if (!q || !a || !deck) { toast(‘Remplis tous les champs !’); return; }
cards.push({ id: Date.now(), sub: sub, deck: deck, q: q, a: a, ctx: ctx, diff: ‘new’ });
save(); toast(‘Carte ajoutee !’); view = ‘home’; renderHome();
};
document.getElementById(‘b-cancelcard’).onclick = function() { view = ‘home’; renderHome(); };
}

// ── MANAGE ──
function renderManage() {
var el = document.getElementById(‘panel-manage’);
if (!cards.length) { el.innerHTML = ‘<div class="empty-box"><p>Aucune carte.</p></div>’; return; }
var html = ‘<div class="mlist">’;
for (var i = 0; i < cards.length; i++) {
var c = cards[i], s = findSub(c.sub);
html += ‘<div class="mi">’
+ ‘<div class="mq">’ + c.q + ‘</div>’
+ (s ? ‘<span class="ms">’ + s.icon + ’ ’ + s.name + ‘</span>’ : ‘’)
+ ‘<span class="mb">’ + c.deck + ‘</span>’
+ ‘<button class="del" data-cid="' + c.id + '">✕</button>’
+ ‘</div>’;
}
html += ‘</div>’;
el.innerHTML = html;

var dels = el.getElementsByClassName(‘del’);
for (var d = 0; d < dels.length; d++) {
(function(btn) {
btn.onclick = function() {
var cid = parseInt(this.getAttribute(‘data-cid’), 10);
var nc = [];
for (var i = 0; i < cards.length; i++) if (cards[i].id !== cid) nc.push(cards[i]);
cards = nc;
save(); buildQueue(); renderManage(); toast(‘Supprimee !’);
};
})(dels[d]);
}
}

// ── MODAL ──
document.getElementById(‘btn-ok-folder’).onclick = function() {
var name = document.getElementById(‘fn’).value.trim();
var icon = document.getElementById(‘fi’).value.trim() || ‘📁’;
if (!name) { toast(‘Donne un nom !’); return; }
subjects.push({ id: ‘s’ + Date.now(), name: name, icon: icon });
save();
document.getElementById(‘modal-bg’).className = ‘modal-bg’;
document.getElementById(‘fn’).value = ‘’;
document.getElementById(‘fi’).value = ‘’;
renderHome(); toast(‘Dossier cree !’);
};
document.getElementById(‘btn-ko-folder’).onclick = function() {
document.getElementById(‘modal-bg’).className = ‘modal-bg’;
};

// ── TAB BUTTONS ──
document.getElementById(‘t-study’).onclick = function() { showTab(‘study’); view = ‘home’; renderHome(); };
document.getElementById(‘t-add’).onclick    = function() { showTab(‘add’);   renderAdd(); };
document.getElementById(‘t-manage’).onclick = function() { showTab(‘manage’); renderManage(); };

// ── TOAST ──
function toast(msg) {
var el = document.getElementById(‘toast’);
el.textContent = msg; el.className = ‘toast show’;
setTimeout(function() { el.className = ‘toast’; }, 2400);
}

// ── INIT ──
initState();
renderHome();

} catch(e) { showErr(e); }
